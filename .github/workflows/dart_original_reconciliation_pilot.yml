name: Original DART Financial Document Pilot

# Read-only original document pilot, manual only after first successful smoke test.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dart_original_reconciliation_pilot.yml']
  workflow_dispatch:
    inputs:
      documents:
        description: "1-3 original DART documents"
        required: true
        default: "2"

permissions:
  contents: read

concurrency:
  group: original-dart-financial-document-pilot
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Check original DART table recognition aggregate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test archive parser without external data
        working-directory: private
        run: python -m unittest discover -s test -p test_original_dart_document.py
      - name: Compare original documents as unapproved candidates
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          LIMIT: ${{ inputs.documents || '2' }}
        run: |
          set -euo pipefail
          if ! [[ "$LIMIT" =~ ^[1-3]$ ]]; then exit 1; fi
          python -m operations.audit_original_dart_document --limit "$LIMIT"
      # Do not publish raw ZIP, receipt numbers, account amounts or private
      # report. No artifact, no commits and no sidecar approval.
