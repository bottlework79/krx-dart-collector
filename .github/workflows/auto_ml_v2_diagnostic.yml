name: ML V2 - Read Only V1 Diagnostic Audit (Private)

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: private-krx-ml-v2-diagnostic
  cancel-in-progress: false

jobs:
  v2-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private pinned V1 research reports
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V2 offline synthetic regression tests
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_diagnostics -v
      - name: Verify V1 fingerprint and generate read-only V2 report
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v2_diagnostics \
            --input-dir data/ml/auto_research_v1 \
            --output /tmp/v1_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v1_diagnostic.json')
          r=json.loads(p.read_text())
          assert r['v1_fingerprint']=='712dfbf4ea89d603e1030713275c728c1fc01f326d6f45d892005fe511560a37'
          assert r['development_years']==[2019,2020,2021,2022]
          assert r['sealed_year_used'] is False
          assert not r['training_approved'] and not r['point_in_time_verified']
          assert not r['tradable_strategy_approved']
          assert r['year_summary']['2020']['auc_below_random_count']==5
          assert r['year_summary']['2020']['brier_worse_count']==5
          print('V2_DIAGNOSTIC_TEST_AND_SOURCE_GATE_PASS=true')
          PY
      - name: Upload V2 audit report artifact (no private git writes)
        uses: actions/upload-artifact@v4
        with:
          name: v2-v1-readonly-diagnostic
          path: /tmp/v1_diagnostic.json
          if-no-files-found: error
          retention-days: 14

# No new model fit, no sealed 2023 access, no market/KIS DB writes,
# no operating model promotion, no order API, no automatic chain.
