name: Reversal V3 - Independent Price Path Walk-Forward

on:
  workflow_dispatch:
    inputs:
      validation_years:
        description: '검증 연도: 공백으로 구분 (2022~2025)'
        required: false
        type: string
        default: '2022 2023 2024 2025'
      epochs:
        description: '각 연도별 CNN 학습 횟수'
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: reversal-v3-path-walk-forward
  cancel-in-progress: false

jobs:
  validate-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private market DB and source
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install pandas numpy scikit-learn joblib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run V3, V2 and expanding-year synthetic regressions
        working-directory: private
        run: |
          python -m unittest \
            validation.ml.test_reversal_v3 \
            validation.ml.test_reversal_v2 \
            validation.ml.test_reversal_walk_forward \
            -v
      - name: Evaluate independent-path labels on historical KRX
        working-directory: private
        shell: bash
        env:
          YEARS: ${{ inputs.validation_years }}
          EPOCHS: ${{ inputs.epochs }}
        run: |
          set -euo pipefail
          read -ra selected_years <<< "$YEARS"
          if (( ${#selected_years[@]} == 0 )); then
            echo "::error::Select at least one historical validation year"
            exit 1
          fi
          python -m analysis.ml.reversal_v3_walk_forward \
            --validation-years "${selected_years[@]}" --epochs "$EPOCHS"
      - name: Save only independent V3 validation results privately
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/reversal_v3_walk_forward/
          if git diff --cached --quiet; then
            echo 'REVERSAL_V3_NO_CHANGES'
          else
            git commit -m 'Update private independent-path V3 walk-forward results' > /dev/null
            git fetch origin main > /tmp/reversal_v3_fetch.log 2>&1
            if ! git rebase origin/main > /tmp/reversal_v3_rebase.log 2>&1; then
              git rebase --abort > /dev/null 2>&1 || true
              echo '::error::REVERSAL_V3_REBASE_CONFLICT'
              exit 1
            fi
            if ! git push origin HEAD:main > /tmp/reversal_v3_push.log 2>&1; then
              echo '::error::REVERSAL_V3_PUSH_FAILED'
              exit 1
            fi
            echo 'REVERSAL_V3_PRIVATE_SAVED=true'
          fi

# Research-only: V1/V2 models and live scores are never overwritten.
