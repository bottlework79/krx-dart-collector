name: KIS v2 sample regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kis_full_universe_v2_samples_test.yml'
permissions:
  contents: read
concurrency:
  group: kis-v2-sample-regression
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scikit-learn requests cryptography joblib
      - working-directory: private
        run: python -m unittest validation.ml.test_kis_full_universe_v2_samples -v
