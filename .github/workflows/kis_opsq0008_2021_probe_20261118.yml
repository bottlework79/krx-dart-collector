name: KIS OPSQ0008 2020 versus 2021 read-only probe

on:
  push:
    paths:
      - '.github/kis_runs/probe_2021_20261118.flag'

permissions:
  contents: read

concurrency:
  group: kis-auth-single-writer
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private KIS client and KRX reference
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quote dependencies
        run: python -m pip install pandas numpy requests cryptography
      - name: Probe same year and same ticker across historical date windows
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          import requests
          from collectors.price.kis_client import get_token, query
          from collectors.price.kis_adjusted_backfill import reference_year, calendar_windows, datekey

          client=requests.Session()
          key,secret=os.environ["KIS_APP_KEY"],os.environ["KIS_APP_SECRET"]
          token=get_token(client,key,secret,log_reuse=True)
          cases=[
              (2020,"000020","first"),
              (2020,"000020","last"),
              (2021,"000020","first"),
              (2021,"000020","middle"),
              (2021,"000020","last"),
              (2021,"005930","first"),
              (2021,"005930","last"),
              (2021,"000040","first"),
              (2021,"000040","last"),
              (2020,"223310","last"),
          ]
          ref={}
          results=[]
          for year,code,pick in cases:
              if year not in ref:
                  ref[year]=reference_year(year)
              src=ref[year].loc[ref[year].Code.eq(code)]
              if src.empty:
                  print("KIS_YEAR_PROBE="+json.dumps({"year":year,"code":code,"pick":pick,"status":"not_in_reference"}),flush=True)
                  continue
              windows=list(calendar_windows(src.Date.min(),src.Date.max()))
              first,last=windows[0 if pick=="first" else -1 if pick=="last" else len(windows)//2]
              rec={"year":year,"code":code,"pick":pick,"first":datekey(first),"last":datekey(last)}
              try:
                  rows=query(client,key,secret,token,code,datekey(first),datekey(last),adjusted=True)
                  rec.update(status="ok",rows=len(rows))
              except Exception as exc:
                  rec.update(status="error",type=type(exc).__name__,safe_error=str(exc)[:120])
              print("KIS_YEAR_PROBE="+json.dumps(rec,ensure_ascii=False),flush=True)
              results.append(rec)
              time.sleep(1.5)
          print("KIS_YEAR_PROBE_SUMMARY="+json.dumps({
             "ok":sum(v["status"]=="ok" for v in results),
             "error":sum(v["status"]=="error" for v in results),
             "total":len(results)},ensure_ascii=False),flush=True)
          PY
