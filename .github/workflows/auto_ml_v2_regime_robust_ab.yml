name: ML V2 - Volatility-Relative Feature Fixed A/B (Research Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-v2-regime-robust-ab-readonly
  cancel-in-progress: false

jobs:
  fit-fixed-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PRIVATE original research snapshot read-only
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          path: private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen model dependencies
        run: python -m pip install pandas numpy scikit-learn joblib
      - name: Regression tests for unchanged labels and as-of volatility normalization
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_regime_robust -v
      - name: Refit original RandomForest and one engineered-feature model
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v2_regime_robust_test \
            --input-dir data/ml/auto_research_v1 \
            --output /tmp/v2_regime_robust_ab.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/v2_regime_robust_ab.json').read_text())
          assert obj["development_years"]==[2019,2020,2021,2022]
          assert not obj["sealed_year_used"]
          assert obj["candidate"]=="random_forest_shallow"
          assert len(obj["pre_declared_change"]["new_features"])==4
          assert obj["pre_declared_change"]["model_hyperparameters_unchanged"] is True
          assert not any(obj[x] for x in (
              "training_approved","point_in_time_verified",
              "tradable_strategy_approved","model_selected_for_deployment"))
          print("V2_RELATIVE_FEATURE_FIXED_AB_SAFETY_GATE_PASS=true")
          PY
      - name: Upload research comparison result with 14-day retention
        uses: actions/upload-artifact@v4
        with:
          name: v2-regime-robust-fixed-ab
          path: /tmp/v2_regime_robust_ab.json
          if-no-files-found: error
          retention-days: 14

# Reused development folds (not independent holdout). Not production approved.
