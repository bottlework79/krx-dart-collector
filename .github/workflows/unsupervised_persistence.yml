name: Unsupervised KRX - 1 2 3 Consecutive Close Confirmation

on:
  workflow_dispatch:
    inputs:
      validation_years:
        description: '검증 연도 공백 구분'
        required: false
        type: string
        default: '2022 2023 2024 2025'
  push:
    paths:
      - '.github/workflows/unsupervised_persistence.yml'

permissions:
  contents: read

concurrency:
  group: unsupervised-regime-daily-state-persistence
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout KRX OHLCV and previous model/output snapshots from private repo
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU clustering and statistical packages
        run: |
          python -m pip install numpy pandas scikit-learn joblib
      - name: Run persistence and previous unsupervised causality regression tests
        working-directory: private
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m unittest \
            validation.ml.test_unsupervised_persistence \
            validation.ml.test_unsupervised_cadence \
            validation.ml.test_unsupervised_turn_lead \
            validation.ml.test_unsupervised_window_comparison \
            validation.ml.test_unsupervised_regimes -v
      - name: Verify unchanged daily signals then test 2 and 3 day confirmations
        working-directory: private
        shell: bash
        env:
          YEARS: ${{ inputs.validation_years || '2022 2023 2024 2025' }}
        run: |
          set -euo pipefail
          read -ra selected_years <<< "$YEARS"
          if (( ${#selected_years[@]} == 0 )); then
            echo "::error::At least one validation year is required"
            exit 1
          fi
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.unsupervised_persistence \
            --years "${selected_years[@]}"
      - name: Store separate confirmed-state audit outputs in private repo
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_persistence/
          if git diff --cached --quiet; then
            echo 'PERSISTENCE_STUDY_NO_CHANGES=true'
          else
            git commit -m 'Save confirmed 1-2-3 day regime stability research results' >/dev/null
            git fetch origin main >/tmp/persistence_fetch.log 2>&1
            if ! git rebase origin/main >/tmp/persistence_rebase.log 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              echo '::error::PERSISTENCE_REBASE_CONFLICT'
              exit 1
            fi
            if ! git push origin HEAD:main >/tmp/persistence_push.log 2>&1; then
              echo '::error::PERSISTENCE_PUSH_FAILED'
              exit 1
            fi
            echo 'PERSISTENCE_STUDY_PRIVATE_SAVED=true'
          fi

# V2/V3, prices and all earlier unsupervised experimental outputs are unchanged.
