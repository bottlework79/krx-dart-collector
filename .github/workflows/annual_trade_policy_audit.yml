name: KRX ML - Historical Trading Policy Independent Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ml_batches/start_annual_trade_policy_audit_20261117.flag'
      - '.github/ml_batches/start_annual_trade_policy_audit_clean_20261117.flag'
      - '.github/ml_batches/start_annual_trade_policy_audit_market_sessions_20261117.flag'

permissions:
  contents: read

concurrency:
  group: krx-annual-policy-audit
  cancel-in-progress: false

jobs:
  audit-policy-2015-2026:
    name: Reconcile archived prices and policy exits with hold baselines
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private historical data and model outputs
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Synthetic tests for exact OHLCV reconciliation and exit baselines
        working-directory: private
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python -m unittest validation.ml.test_audit_annual_trade_policy -v
      - name: Read-only independent audit of 2015 through 2026 completed trades
        working-directory: private
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python -m analysis.ml.audit_annual_trade_policy \
            --data-dir data \
            --results-root data/ml/annual_trade_policy_v1 \
            --output data/ml/annual_trade_policy_audit_v1 \
            --start-year 2015 --end-year 2026
      - name: Commit diagnostics only (never overwrite learned models or OHLCV)
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/ml/annual_trade_policy_audit_v1/
          if git diff --cached --quiet; then
            echo ANNUAL_AUDIT_ARTIFACTS_UNCHANGED=true
            exit 0
          fi
          git commit -m 'Store independent annual policy source-price and exit audit'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo ANNUAL_AUDIT_PRIVATE_RESULTS_SAVED=true
              exit 0
            fi
            echo "Retrying concurrent push $attempt"
            sleep 5
          done
          echo '::error::Could not commit private audit results'
          exit 1
# The exact sentinel push requests the audit once; manual reruns are possible.
