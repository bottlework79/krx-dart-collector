name: Price CNN - Early Trend Reversal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'train: 새 학습과 검증 / predict: 저장 모델로 최신 후보 평가'
        required: true
        default: 'train'
        type: choice
        options:
          - train
          - predict
      validation_start:
        description: '학습/검증 분리 기준일 (train 전용)'
        required: false
        default: '2025-01-01'
        type: string
      epochs:
        description: 'CNN 반복학습 횟수 (train 전용, 기본 3)'
        required: false
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: price-cnn-manual
  cancel-in-progress: false

jobs:
  price-cnn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private source and yearly KRX database
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install pandas numpy scikit-learn joblib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate price CNN with synthetic offline tests
        working-directory: private
        run: python -m unittest discover -s validation/ml -p 'test_*.py' -v
      - name: Train or score private KRX history
        working-directory: private
        env:
          MODE: ${{ inputs.mode }}
          SPLIT: ${{ inputs.validation_start }}
          EPOCHS: ${{ inputs.epochs }}
        shell: bash
        run: |
          set -euo pipefail
          python -m analysis.ml.price_cnn --mode "$MODE" --validation-start "$SPLIT" --epochs "$EPOCHS"
      - name: Commit model and scores to private repository only
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/price_cnn/
          if git diff --cached --quiet; then
            echo 'PRICE_CNN_NO_CHANGES'
          else
            git commit -m 'Update private OHLCV CNN models and reversal scores' > /dev/null
            git fetch origin main > /tmp/price_cnn_fetch.log 2>&1
            if ! git rebase origin/main > /tmp/price_cnn_rebase.log 2>&1; then
              git rebase --abort > /dev/null 2>&1 || true
              echo '::error::PRICE_CNN_REBASE_CONFLICT'
              exit 1
            fi
            if ! git push origin HEAD:main > /tmp/price_cnn_push.log 2>&1; then
              echo '::error::PRICE_CNN_PUSH_FAILED'
              exit 1
            fi
            echo 'PRICE_CNN_PRIVATE_SAVED=true'
          fi
# Do not publish private DB, per-ticker scores, or model artifacts to the public repository.
