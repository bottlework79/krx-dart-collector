name: Backfill DART Filing Dates (Public Runner)

# Initial one-time push smoke test for an isolated limited historical job.
# Remove this push trigger once the first real API-backed run is verified.
on:
  workflow_dispatch:
    inputs:
      companies:
        description: "New private-DB companies per run (1-10)"
        required: true
        default: "2"
  push:
    branches: [main]
    paths: ['.github/workflows/collect_dart_filing_evidence.yml']

permissions:
  contents: read

concurrency:
  group: dart-filing-metadata-private
  cancel-in-progress: false

jobs:
  filing-date-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Public collection source
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Private financial database checkout
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare official API client and test it without network
        working-directory: public
        run: |
          python -m pip install requests
          python -m py_compile collect_filing_evidence.py
          python tests/test_filing_evidence.py
      - name: Collect official filing dates and write PRIVATE metadata
        working-directory: public
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          LIMIT: ${{ inputs.companies || '1' }}
        run: |
          set -euo pipefail
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 10 ]; then
            echo "Invalid batch count"; exit 1
          fi
          python collect_filing_evidence.py \
            --private-db ../private/data/financial_statements_v2.pkl.gz \
            --output ../private/data/dart_filing_evidence.json \
            --limit "$LIMIT"
      - name: Commit metadata ONLY to private repo
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart_filing_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Add official OpenDART filing date metadata to private evidence ledger"
            git push origin HEAD:main
          fi
      # SECURITY: no artifacts, no echo of raw DART result titles,
      # no public data files, no financial DB or scoring writes.
