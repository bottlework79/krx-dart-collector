name: 통합 머신러닝 - 자율 학습 및 검증 엔진
# Migration-only temporary execution. No scheduled training or self-dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kis_ml_research_engine.yml'
permissions:
  contents: read
concurrency:
  group: kis-ml-research-engine-v1
  cancel-in-progress: false
env:
  STATE_BRANCH: kis-ml-engine-state-v1
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private engine and unchanged plan
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: b54e7554379872f9c129b5dff0931848f2fc38fb
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
          sparse-checkout: |
            analysis/ml/kis_ml_research_engine.py
            docs/kis_ml_engine_plan.json
          sparse-checkout-cone-mode: false
      - name: Checkout private result branch only
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: kis-ml-engine-state-v1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: storage
          persist-credentials: true
      - name: Verify current state checkout
        working-directory: storage
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$STATE_BRANCH"
          git config user.name 'KIS research engine'
          git config user.email 'actions@users.noreply.github.com'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ledger and regression dependencies
        run: python -m pip install numpy==2.4.6 pandas==3.1.1 pyarrow==26.0.1 scikit-learn==1.9.1 scipy==1.17.1 joblib==1.16.0
      - name: Test chronology, seal, ledger migration and retry
        run: python source/analysis/ml/kis_ml_research_engine.py selftest
      - name: Verify backup, migrate results and commit private state atomically
        shell: bash
        run: |
          set -euo pipefail
          python source/analysis/ml/kis_ml_research_engine.py migrate \
            --plan source/docs/kis_ml_engine_plan.json \
            --storage storage \
            --backup-ref backup/pre-results-ledger-state-20261128
