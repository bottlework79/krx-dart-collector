name: ML V2 - V1 Outcome Observability and Corporate-Action Window Audit

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ml-v2-observability-audit
  cancel-in-progress: false

jobs:
  audit-v1-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private original V1 historical KRX and ledger (read only)
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: private
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only scientific dependencies
        run: python -m pip install pandas numpy scikit-learn joblib
      - name: Verify synthetic label observability and sealed-year exclusion
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_observability_audit -v
      - name: Audit historical year-by-year missing labels and quality windows
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v2_observability_audit \
            --input-dir data/ml/auto_research_v1 \
            --output /tmp/v2_observability_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/v2_observability_audit.json').read_text())
          assert report['development_years']==[2019,2020,2021,2022]
          assert report['source_years_read']==list(range(2015,2023))
          assert report['selected_symbols']==80
          assert report['sealed_year_used'] is False
          assert not report['training_approved']
          assert not report['point_in_time_verified']
          assert not report['tradable_strategy_approved']
          for year in (2019,2020,2021,2022):
              assert report['per_year'][str(year)]['development_fold_eligible']>0
          print('V2_OBSERVABILITY_FOLD_SHA_AND_SEALED_YEAR_GATE_PASS=true')
          PY
      - name: Verify 2020 event and official matcher synthetic guards
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_2020_event_queue validation.ml.test_v2_event_official_match -v
      - name: Verify official disclosure provenance fail-closed gate (synthetic only)
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_official_evidence_gate -v
      - name: Export 2020 dated zero-volume observations without official attribution
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v2_2020_event_queue --output /tmp/v2_2020_event_queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/v2_2020_event_queue.json').read_text())
          assert report['sealed_year_used'] is False
          assert report['source_years_read']==list(range(2015,2023))
          assert not report['official_exchange_verified']
          assert not report['training_approved']
          assert not report['point_in_time_verified']
          assert not report['tradable_strategy_approved']
          runs=report['zero_volume_runs']
          assert sum(r['observations'] for r in runs)==report['event_counts']['zero_volume']
          assert all(r['first_date'][:4]=='2020' and r['last_date'][:4]=='2020' for r in runs)
          print('V2_DATED_RUNS='+json.dumps(runs,ensure_ascii=False))
          PY
      - name: Audit 2020 exclusion rows against frozen V1 source (read only)
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_2020_exclusion_rows -v
          python -m analysis.ml.v2_2020_exclusion_rows --output /tmp/v2_2020_exclusion_rows.json > /tmp/v2_exclusion_stdout.log
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          report=json.loads(Path('/tmp/v2_2020_exclusion_rows.json').read_text())
          assert report['source_years_read']==list(range(2015,2023))
          assert report['sealed_year_used'] is False
          assert report['official_verified'] is False
          assert not report['training_approved']
          assert not report['point_in_time_verified']
          assert not report['tradable_strategy_approved']
          rows=report['suspects']
          assert len(rows)==report['excluded_rows']
          assert all(r['date'].startswith('2020-') for r in rows)
          assert len({(r['code'],r['date']) for r in rows})==len(rows)
          counts=Counter(reason for r in rows for reason in r['reasons'])
          assert dict(counts)==report['reason_counts']
          print('V2_EXCLUSION_2020_SUMMARY='+json.dumps({
              'excluded_rows':len(rows),'reason_counts':dict(counts),
              'jump_past_rows':sum(r['past_jump_window'] for r in rows),
              'jump_future_rows':sum(r['future_jump_window'] for r in rows),
              'unique_symbols':len({r['code'] for r in rows}),
              'comparison_37_is_same_population':False
          },ensure_ascii=False))
          PY
      - name: Verify and extract 2017-2022 raw daily jump provenance (read only)
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_raw_jump_provenance -v
          python - <<'PY'
          from analysis.ml.v2_raw_jump_provenance import run
          report=run(output='/tmp/v2_raw_jump_provenance.json')
          assert report['source_years_read']==list(range(2015,2023))
          assert report['event_years']==list(range(2017,2023))
          assert report['selected_symbols']==80
          assert not report['sealed_year_used']
          assert not report['official_corporate_action_verified']
          assert not report['training_approved']
          assert not report['point_in_time_verified']
          assert not report['tradable_strategy_approved']
          assert len({(e['code'],e['date']) for e in report['raw_daily_jump_events']})==report['raw_daily_jump_count']
          import json
          print('V2_RAW_JUMP_EVENTS='+json.dumps(report['raw_daily_jump_events'],ensure_ascii=False))
          PY
      - name: Upload read-only diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-observability-audit
          path: |
            /tmp/v2_observability_audit.json
            /tmp/v2_2020_event_queue.json
            /tmp/v2_2020_exclusion_rows.json
            /tmp/v2_raw_jump_provenance.json
          if-no-files-found: error
          retention-days: 14

# Never updates existing training models, historical KRX, KIS, or private results.
# Outcome data is used only for research quality accounting, never for signals.
