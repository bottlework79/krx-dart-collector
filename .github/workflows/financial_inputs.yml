name: Process DART Financial Inputs (Stage 2)
on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 6자리 (비우면 1차 DB 기준 배치)'
        required: false
        type: string
        default: '007860'
      batch_index:
        description: '2차 배치 번호 (0부터, 종목코드 공란일 때)'
        required: false
        type: number
        default: 0
      batch_size:
        description: '2차 배치 종목 수 (1~25)'
        required: false
        type: number
        default: 2
      retry_incomplete_only:
        description: '동일한 1차 원천의 기존 검증 완료 자료 건너뛰기'
        required: false
        type: boolean
        default: true
      start_year:
        description: 'Start reporting year (inclusive)'
        required: true
        type: string
        default: '2015'
      end_year:
        description: 'End reporting year (inclusive)'
        required: true
        type: string
        default: '2026'
permissions:
  contents: read
concurrency:
  group: dart-private-collection
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Offline Stage 2 batch and resume regression tests
        working-directory: private
        run: python -m unittest validation.financials.test_smoke.StageTwoBatchRegressionTests
      - name: Process and checkpoint Stage 2 inputs by year
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          RETRY_INCOMPLETE_ONLY: ${{ inputs.retry_incomplete_only }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          set -uo pipefail
          if [[ ! "$START_YEAR" =~ ^[0-9]{4}$ || ! "$END_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Start and end years must be four digits" >&2
            exit 1
          fi
          if (( 10#$START_YEAR < 2015 || 10#$END_YEAR > 2026 || 10#$START_YEAR > 10#$END_YEAR )); then
            echo "Invalid year range: $START_YEAR to $END_YEAR" >&2
            exit 1
          fi
          if [[ -n "$STOCK_CODE" && ! "$STOCK_CODE" =~ ^[0-9]{6}$ ]]; then
            echo "stock_code must be six digits or empty for a batch" >&2
            exit 1
          fi
          if [[ -z "$STOCK_CODE" ]]; then
            if [[ ! "$BATCH_INDEX" =~ ^[0-9]+$ || ! "$BATCH_SIZE" =~ ^[0-9]+$ ]] || (( BATCH_SIZE < 1 || BATCH_SIZE > 25 )); then
              echo "batch_index must be >=0 and batch_size must be 1..25" >&2
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=0
          for (( y=10#$START_YEAR; y<=10#$END_YEAR; y++ )); do
            echo "::group::Financial inputs $y"
            args=(--year "$y" --enrich-original)
            if [[ -n "$STOCK_CODE" ]]; then
              args+=(--code "$STOCK_CODE")
            else
              args+=(--batch-index "$BATCH_INDEX" --batch-size "$BATCH_SIZE")
            fi
            if [[ "$RETRY_INCOMPLETE_ONLY" == "true" ]]; then
              args+=(--retry-incomplete-only)
            fi
            if python -m collectors.financial.collect_inputs "${args[@]}"; then
              echo "STAGE2_YEAR_COMPLETE $y"
            else
              echo "::error::Stage 2 processing failed for year $y; completed records will be kept"
              failed=1
            fi
            # Checkpoint EACH year, even if another period failed.
            git add -- data/financial_inputs/ || exit 1
            if ! git diff --cached --quiet; then
              git commit -m "Update Stage 2 financial inputs ($y)" || exit 1
              git fetch origin main || exit 1
              git rebase origin/main || exit 1
              git push origin HEAD:main || exit 1
              echo "STAGE2_YEAR_CHECKPOINT $y"
            fi
            echo "::endgroup::"
          done
          args=(--record-stage stage2 --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [[ -n "$STOCK_CODE" ]]; then args+=(--code "$STOCK_CODE"); fi
          python -m analysis.financials.processing_history "${args[@]}" || exit 1
          git add -- data/processing_history/ || exit 1
          if ! git diff --cached --quiet; then
            git commit -m "Record Stage 2 processing history" || exit 1
            git fetch origin main || exit 1
            git rebase origin/main || exit 1
            git push origin HEAD:main || exit 1
          fi
          if (( failed != 0 )); then
            echo "::error::One or more Stage 2 years had errors; rerun the same batch with retry_incomplete_only=true"
            exit 1
          fi
          echo "STAGE2_ALL_YEARS_COMPLETE"
