name: Process DART Financial Inputs (Stage 2)
on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '6-digit ticker'
        required: true
        type: string
        default: '007860'
      year:
        description: 'Reporting year or inclusive range (e.g. 2015-2026)'
        required: true
        type: string
        default: '2026'
permissions:
  contents: read
concurrency:
  group: dart-private-collection
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Extract original financial inputs
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          if [[ "$YEAR" =~ ^([0-9]{4})-([0-9]{4})$ ]]; then
            start="${BASH_REMATCH[1]}"
            end="${BASH_REMATCH[2]}"
            if (( 10#$start < 2015 || 10#$end > 2026 || 10#$start > 10#$end )); then
              echo "Invalid year range: $YEAR" >&2
              exit 1
            fi
            for (( y=10#$start; y<=10#$end; y++ )); do
              echo "::group::Financial inputs $y"
              python -m collectors.financial.collect_inputs --code "$STOCK_CODE" --year "$y" --enrich-original
              echo "::endgroup::"
            done
          elif [[ "$YEAR" =~ ^[0-9]{4}$ ]]; then
            python -m collectors.financial.collect_inputs --code "$STOCK_CODE" --year "$YEAR" --enrich-original
          else
            echo "Expected YYYY or YYYY-YYYY, got: $YEAR" >&2
            exit 1
          fi
      - name: Commit processed inputs
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/financial_inputs/
          if ! git diff --cached --quiet; then
            git commit -m "Update annual DART financial inputs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
