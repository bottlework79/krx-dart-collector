name: KRX ML - Annual Policy Batch 2015-2026

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ml_batches/start_annual_trade_policy_2015_2026_20261117.flag'

permissions:
  contents: read

concurrency:
  group: krx-annual-policy-all-years
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify annual archives and synthetic training tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private research repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Run synthetic annual train-policy and causal regression tests
        working-directory: private
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python -m unittest validation.ml.test_annual_trade_policy -v
      - name: Verify 2010-2026 actual OHLCV annual coverage
        working-directory: private
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from analysis.ml.unsupervised_feedback_2010 import load_full_history
          src = load_full_history(
              "data", "data/historical_krx_2010_2014", end_year=2026)
          rows = []
          for year in range(2010, 2027):
              part = src.loc[src["Date"].dt.year.eq(year)]
              dates = int(part["Date"].nunique())
              symbols = int(part["Code"].nunique())
              row = {"year":year,"bars":int(len(part)),
                     "trading_dates":dates,"codes":symbols}
              rows.append(row)
              # This is a completeness *guard*, not a guarantee of data
              # correctness or listed/delisted stock coverage.
              minimum_dates = 200 if year < 2026 else 120
              if dates < minimum_dates or symbols < 500:
                  raise SystemExit(
                      f"ANNUAL_OHLCV_COVERAGE_INSUFFICIENT={row} "
                      f"required_dates>={minimum_dates},codes>=500")
          print("ANNUAL_2010_2026_DATA_COVERAGE=" +
                json.dumps(rows, ensure_ascii=False), flush=True)
          PY

  train-and-evaluate:
    needs: preflight
    name: Year ${{ matrix.eval_year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        eval_year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Checkout private data, models and research code
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Train learned buy/hold/sell policy and assess held-out year
        working-directory: private
        env:
          EVAL_YEAR: ${{ matrix.eval_year }}
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python -m analysis.ml.annual_trade_policy \
              --eval-year "$EVAL_YEAR" \
              --data-dir data \
              --historical-dir data/historical_krx_2010_2014 \
              --output-dir data/ml/annual_trade_policy_v1 \
              --fee-per-side 0.0025
      - name: Commit each evaluated year to distinct private output directory
        working-directory: private
        env:
          EVAL_YEAR: ${{ matrix.eval_year }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- \
            "data/ml/annual_trade_policy_v1/$EVAL_YEAR/summary.json" \
            "data/ml/annual_trade_policy_v1/$EVAL_YEAR/model.joblib" \
            "data/ml/annual_trade_policy_v1/$EVAL_YEAR/completed_trades.csv" \
            "data/ml/annual_trade_policy_v1/$EVAL_YEAR/daily_signals.csv" \
            "data/ml/annual_trade_policy_v1/$EVAL_YEAR/pending_positions.csv"
          if git diff --cached --quiet; then
            echo ANNUAL_RESULT_UNCHANGED=true
            exit 0
          fi
          git commit -m "Save learned annual 2010-era trading-policy research for $EVAL_YEAR"
          # Different matrix jobs write different year paths. Retry only
          # when another job pushed its result between fetch and push.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "ANNUAL_PRIVATE_RESULT_SAVED=$EVAL_YEAR"
              exit 0
            fi
            echo "Concurrent distinct-year push; retry $attempt/8"
            sleep 5
          done
          echo '::error::Unable to publish private annual result after eight retries'
          exit 1

  aggregate-yearly-results:
    name: Aggregate annual scorecard
    needs: [preflight, train-and-evaluate]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private results
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Build aggregate scorecard, record missing/failed years explicitly
        working-directory: private
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('data/ml/annual_trade_policy_v1')
          fields = [
              'year','discovery_years','feedback_year',
              'buy_alerts','learned_sell_alerts',
              'closed_trades','pending_or_unresolved',
              'forced_year_end_exits','mean_net_trade_return',
              'median_net_trade_return','positive_trade_fraction','status']
          summary = []
          for year in range(2015, 2027):
              path = root/str(year)/'summary.json'
              if not path.is_file():
                  summary.append({"year":year,"status":"MISSING_OR_FAILED"})
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              e = data['evaluation']
              summary.append({
                  'year':year, 'discovery_years':data['unlabeled_discovery_years'],
                  'feedback_year':data['feedback_year'],
                  'buy_alerts':e['buy_alerts'],
                  'learned_sell_alerts':e['learned_sell_alerts'],
                  'closed_trades':e['closed_trades'],
                  'pending_or_unresolved':e['pending_or_unresolved'],
                  'forced_year_end_exits':e['forced_year_end_exits'],
                  'mean_net_trade_return':e['mean_net_trade_return'],
                  'median_net_trade_return':e['median_net_trade_return'],
                  'positive_trade_fraction':e['positive_trade_fraction'],
                  'status':'COMPLETED'})
          root.mkdir(parents=True, exist_ok=True)
          with (root/'batch_2015_2026_summary.csv').open(
                  'w', newline='', encoding='utf-8-sig') as out:
              writer = csv.DictWriter(out, fieldnames=fields)
              writer.writeheader()
              writer.writerows(summary)
          print('ANNUAL_BATCH_RESULT='+
                json.dumps(summary,ensure_ascii=False),flush=True)
          missing = [x['year'] for x in summary if x['status']!='COMPLETED']
          if missing:
              (root/'batch_missing_years.json').write_text(
                  json.dumps(missing,ensure_ascii=False),
                  encoding='utf-8')
          else:
              (root/'batch_missing_years.json').write_text(
                  '[]',encoding='utf-8')
          PY
      - name: Save private batch summary
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- \
            data/ml/annual_trade_policy_v1/batch_2015_2026_summary.csv \
            data/ml/annual_trade_policy_v1/batch_missing_years.json
          if git diff --cached --quiet; then
            echo ANNUAL_BATCH_SUMMARY_UNCHANGED=true
          else
            git commit -m 'Save 2015-2026 annual learned policy batch scorecard'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Mark incomplete annual sweep as failed, preserving partial results
        working-directory: private
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          missing=json.loads(Path(
              'data/ml/annual_trade_policy_v1/batch_missing_years.json'
          ).read_text())
          if missing:
              raise SystemExit(f"ANNUAL_POLICY_INCOMPLETE_YEARS={missing}")
          print('ANNUAL_POLICY_ALL_2015_2026_YEARS_COMPLETE=true')
          PY
# Trigger once via creation of the exact sentinel file above, or manually.
# No cron; no user action is required after the initial sentinel push.
