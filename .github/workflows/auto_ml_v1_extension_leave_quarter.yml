name: ML V1 Extension - Frozen Leave Largest Quarter Out
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-krx-v1-leave-quarter
  cancel-in-progress: false
jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private frozen research
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scikit-learn joblib
      - name: Regression guards
        working-directory: private
        run: python -m unittest validation.ml.test_v1_extension_leave_quarter validation.ml.test_v1_extension_top10_concentration -v
      - name: Frozen parity and quarter sensitivity
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v1_extension_leave_quarter_run | tee /tmp/v1-leave-quarter.log
          python - <<'PY'
          import json
          from pathlib import Path
          line=next(x for x in Path('/tmp/v1-leave-quarter.log').read_text().splitlines() if x.startswith('V1_LEAVE_QUARTER='))
          d=json.loads(line.split('=',1)[1])
          assert d['sealed_2023_read'] is False
          assert all(d[k] is False for k in ('training_approved','point_in_time_verified','tradable_strategy_approved'))
          assert set(d['per_year'])=={'2019','2020','2021','2022'}
          assert [d['per_year'][y]['nonoverlap_n'] for y in ('2019','2020','2021','2022')]==[226,224,226,221]
          Path('/tmp/v1-leave-quarter.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-frozen-leave-quarter
          path: /tmp/v1-leave-quarter.json
          if-no-files-found: error
