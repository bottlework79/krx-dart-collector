name: KIS Adjusted OHLCV Pilot (public orchestrator, private source)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/kis_runs/start_kis_adjusted_pilot_public_20261117.flag'

permissions:
  contents: read

concurrency:
  group: kis-two-stock-adjusted-ohclv-probe-public
  cancel-in-progress: false

jobs:
  public-secret-private-collector-pilot:
    name: KIS adjusted/raw comparison for corporate-action examples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private KRX research code and historical data
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install non-trading price-query dependency
        run: python -m pip install requests

      - name: Verify KIS credentials are registered without revealing values
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$KIS_APP_KEY" ] || [ -z "$KIS_APP_SECRET" ]; then
            echo '::error::KIS_APP_KEY or KIS_APP_SECRET is missing in PUBLIC krx-dart-collector Actions Secrets'
            exit 1
          fi
          echo KIS_ACTION_SECRETS_PRESENT=true

      - name: Query KIS adjusted and original prices (no trading orders)
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          python -m collectors.price.kis_adjusted_probe

      - name: Commit pilot comparison to private repository only
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/ml/kis_adjustment_probe/adjusted_vs_raw_2025_2026.json
          if git diff --cached --quiet; then
            echo KIS_ADJUSTED_PILOT_UNCHANGED=true
            exit 0
          fi
          git commit -m 'Save KIS adjusted versus original 2025/2026 verification'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo KIS_ADJUSTED_PILOT_RESULTS_SAVED_PRIVATE=true
              exit 0
            fi
            echo "Another private commit was pushed; retry $attempt"
            sleep 5
          done
          echo '::error::KIS verification succeeded but results could not be saved'
          exit 1
# This is a read-only quotation API pilot: no balance, account, orders or trades.
# Secrets are supplied by the PUBLIC workflow execution and never stored in code/artifacts.
