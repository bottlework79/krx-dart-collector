name: Current PER Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current_per_pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private project
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pykrx pandas numpy
      - name: Validate Python syntax
        working-directory: private
        run: python -m py_compile operations/current_ttm_per_snapshot.py
      - name: Run private current PER pilot
        working-directory: private
        run: |
          python -m operations.current_ttm_per_snapshot --current-caps --max-tickers 3 > /dev/null 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("dart_results/current_valuation/current_ttm_per_summary.json").read_text())
          total = report.get("companies")
          quotes = report.get("network_quote_candidates")
          calculated = report.get("per_available")
          statuses = report.get("by_status", {})
          if not all(type(x) is int for x in (total, quotes, calculated)):
              raise SystemExit("INVALID_AGGREGATE_SUMMARY")
          if not (0 <= calculated <= quotes <= 3 and total >= 0):
              raise SystemExit("INVALID_AGGREGATE_COUNTS")
          if sum(statuses.values()) != total:
              raise SystemExit("INVALID_STATUS_COUNTS")
          print("CURRENT_PER_PILOT=SUCCESS")
          print("CURRENT_PER_QUOTES_RECEIVED=" + str(quotes))
          diagnostics = report.get("quote_diagnostics", {})
          allowed = ("attempted", "empty", "no_positive_cap", "exception", "received")
          if any(type(diagnostics.get(k)) is not int or diagnostics[k] < 0 for k in allowed):
              raise SystemExit("INVALID_QUOTE_DIAGNOSTICS")
          if diagnostics["attempted"] != sum(diagnostics[k] for k in allowed if k != "attempted"):
              raise SystemExit("UNBALANCED_QUOTE_DIAGNOSTICS")
          for key in allowed + ("fallback_empty", "fallback_exception", "fallback_ticker_absent"):
              value = diagnostics.get(key)
              if type(value) is not int or value < 0:
                  raise SystemExit("INVALID_DIAGNOSTIC_COUNT")
              print("CURRENT_PER_KRX_" + key.upper() + "=" + str(value))
          kinds = diagnostics.get("fallback_error_types", {})
          permitted = {"KeyError", "ValueError", "TypeError", "IndexError", "AttributeError", "ConnectionError", "Timeout", "JSONDecodeError", "Other"}
          if not isinstance(kinds, dict) or any(k not in permitted or type(v) is not int or v < 0 for k,v in kinds.items()):
              raise SystemExit("INVALID_ERROR_CLASS_COUNTS")
          if sum(kinds.values()) != diagnostics["fallback_exception"]:
              raise SystemExit("ERROR_CLASS_COUNT_MISMATCH")
          stages = diagnostics.get("fallback_keyerror_stage", {})
          if not isinstance(stages, dict) or set(stages) != {"api", "columns", "other"} or any(type(v) is not int or v < 0 for v in stages.values()):
              raise SystemExit("INVALID_KEYERROR_STAGE")
          if sum(stages.values()) != kinds.get("KeyError", 0):
              raise SystemExit("KEYERROR_STAGE_MISMATCH")
          for stage in ("api", "columns", "other"):
              print("CURRENT_PER_KRX_KEYERROR_STAGE_" + stage.upper() + "=" + str(stages[stage]))
          for kind in sorted(kinds):
              print("CURRENT_PER_KRX_ERROR_CLASS_" + kind.upper() + "=" + str(kinds[kind]))
          print("CURRENT_PER_CALCULATED=" + str(calculated))
          print("CURRENT_PER_MISSING_QUOTE=" + str(statuses.get("missing_current_market_cap", 0)))
          PY
