name: KRX Daily Stock Screener (Public Runner)

# Run private KRX code on public Actions minutes, keep data and results private.
on:
  workflow_dispatch:
  schedule:
    # Weekdays 16:30 KST (07:30 UTC), same as previous private workflow.
    - cron: '30 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: krx-daily-public-runner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout public workflow
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Checkout private KRX data and implementation
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stock dependencies
        run: python -m pip install finance-datareader pandas numpy
      - name: Verify private entrypoints exist
        run: |
          test -f private/operations/run.py
          test -f private/operations/weinstein_screener.py
          test -f private/data/market_1250.pkl.gz
          python -m py_compile private/operations/run.py private/operations/weinstein_screener.py
      - name: Update private price DB
        id: price_update
        continue-on-error: true
        working-directory: private
        shell: bash
        run: |
          started=$SECONDS
          if python -c 'from data_manager import load_or_update_master_database; load_or_update_master_database()' > /tmp/krx_private_update.log 2>&1; then
            echo "KRX_PRICE_UPDATE=SUCCESS duration_seconds=$((SECONDS-started))"
          else
            echo "::error::KRX_PRICE_UPDATE=FAILED duration_seconds=$((SECONDS-started))"
            exit 1
          fi
      - name: Analyze patterns using updated DB
        id: analysis
        if: steps.price_update.outcome == 'success'
        continue-on-error: true
        working-directory: private
        shell: bash
        run: |
          started=$SECONDS
          if python -c 'from data_manager import get_recent_database; from screener import run_screening; import pandas as pd; master=pd.read_pickle("data/market_1250.pkl.gz", compression="gzip"); run_screening(get_recent_database(master), master_database=master)' > /tmp/krx_private_patterns.log 2>&1; then
            echo "KRX_PATTERN_ANALYSIS=SUCCESS duration_seconds=$((SECONDS-started))"
          else
            echo "::error::KRX_PATTERN_ANALYSIS=FAILED duration_seconds=$((SECONDS-started))"
            exit 1
          fi
      - name: Commit changed private master DB
        if: always()
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market_1250.pkl.gz
          if git diff --cached --quiet; then
            echo "PRIVATE_MARKET_DB_CHANGED=False"
          else
            git commit -m "Update 1250-day master database" > /dev/null
            # A long-running job may start before other private commits land.
            # Preserve those commits without force-pushing or exposing private logs.
            git fetch origin main > /tmp/krx_private_fetch.log 2>&1
            if ! git rebase origin/main > /tmp/krx_private_rebase.log 2>&1; then
              git rebase --abort > /dev/null 2>&1 || true
              echo "::error::PRIVATE_DB_REBASE_CONFLICT: remote DB may have changed; no force push attempted"
              exit 1
            fi
            if ! git push origin HEAD:main > /tmp/krx_private_push.log 2>&1; then
              echo "::error::PRIVATE_DB_PUSH_FAILED: check token write access, branch protection or concurrent commits"
              exit 1
            fi
            echo "PRIVATE_MARKET_DB_CHANGED=True"
          fi
      - name: Weinstein screening on updated private DB
        if: steps.price_update.outcome == 'success' && steps.analysis.outcome == 'success'
        working-directory: private
        shell: bash
        run: |
          if python -m operations.weinstein_screener > /tmp/krx_private_weinstein.log 2>&1; then
            echo "PRIVATE_WEINSTEIN_SCREENING=SUCCESS"
          else
            echo "PRIVATE_WEINSTEIN_SCREENING=FAILED"
            exit 1
          fi
      - name: Fail if main analysis failed
        if: steps.price_update.outcome != 'success' || steps.analysis.outcome != 'success'
        run: |
          echo "KRX daily price update or pattern analysis failed. Raw private logs were intentionally not published."
          exit 1

# No artifacts, no public ticker lists, no public DB commits.
