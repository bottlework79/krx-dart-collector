name: KRX Price Collection (Public Runner)

# Run private KRX code on public Actions minutes, keep data and results private.
on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 (예: 005930, 비우면 전체 DB 갱신)'
        required: false
        type: string
        default: ''
      trading_days:
        description: '전체 신규 수집 시 거래일 수 (1~1250, 기본 1250)'
        required: false
        type: number
        default: 1250
      days:
        description: '단일 종목 조회 기간 (달력일)'
        required: false
        type: number
        default: 45
  schedule:
    # Weekdays 16:30 KST (07:30 UTC), same as previous private workflow.
    - cron: '30 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: krx-daily-public-runner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout public workflow
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: false
      - name: Checkout private KRX data and implementation
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stock dependencies
        run: python -m pip install finance-datareader pandas numpy requests
      - name: Verify private entrypoints exist
        run: |
          test -f private/collectors/price/collect_price.py
          python -m py_compile private/collectors/price/collect_price.py
      - name: Collect stock prices
        id: price_update
        working-directory: private
        shell: bash
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
          DAYS: ${{ inputs.days }}
          TRADING_DAYS: ${{ inputs.trading_days }}
        run: |
          set -euo pipefail
          if [[ -n "${STOCK_CODE}" ]]; then
            if [[ ! "${STOCK_CODE}" =~ ^[0-9]{6}$ ]]; then
              echo "::error::Stock code must be exactly six digits"
              exit 1
            fi
            if [[ ! "${DAYS}" =~ ^[0-9]+$ ]] || (( DAYS < 1 )); then
              echo "::error::Days must be a positive integer"
              exit 1
            fi
            python -m collectors.price.collect_price --code "${STOCK_CODE}" --trading-days "${TRADING_DAYS:-1}"
          else
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              python -m collectors.price.collect_price --incremental
            else
              python -m collectors.price.collect_price --trading-days "${TRADING_DAYS:-1250}"
            fi
          fi
      - name: Commit changed private master DB
        if: ${{ success() && inputs.stock_code == '' }}
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market_1250.pkl.gz
          if git diff --cached --quiet; then
            echo "PRIVATE_MARKET_DB_CHANGED=False"
          else
            git commit -m "Update 1250-day prices and KRX market caps" > /dev/null
            # A long-running job may start before other private commits land.
            # Preserve those commits without force-pushing or exposing private logs.
            git fetch origin main > /tmp/krx_private_fetch.log 2>&1
            if ! git rebase origin/main > /tmp/krx_private_rebase.log 2>&1; then
              git rebase --abort > /dev/null 2>&1 || true
              echo "::error::PRIVATE_DB_REBASE_CONFLICT: remote DB may have changed; no force push attempted"
              exit 1
            fi
            if ! git push origin HEAD:main > /tmp/krx_private_push.log 2>&1; then
              echo "::error::PRIVATE_DB_PUSH_FAILED: check token write access, branch protection or concurrent commits"
              exit 1
            fi
            echo "PRIVATE_MARKET_DB_CHANGED=True"
          fi
# No artifacts, no public ticker lists, no public DB commits.
