name: Trend Indicators

on:
  workflow_dispatch:
    inputs:
      indicator:
        description: '추세 지표'
        required: true
        type: choice
        options:
          - moving_average
          - relative_strength
          - volume
          - price_position
          - returns
          - weinstein
          - rs_history
      stock_code:
        description: '종목코드 6자리 (비우면 전체, RS는 전체 비교 권장)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run selected indicator
        working-directory: private
        env:
          INDICATOR: ${{ inputs.indicator }}
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          set -euo pipefail
          if [[ -n "$STOCK_CODE" ]]; then
            python -m analysis.trends.run --indicator "$INDICATOR" --code "$STOCK_CODE"
          else
            python -m analysis.trends.run --indicator "$INDICATOR"
          fi
