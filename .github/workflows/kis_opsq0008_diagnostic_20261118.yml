name: KIS OPSQ0008 read-only quote diagnostic 2026-11-18

on:
  push:
    paths:
      - '.github/kis_runs/diagnose_opsq0008_20261118.flag'

permissions:
  contents: read

concurrency:
  group: kis-auth-single-writer
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout existing private KIS data, token cache, and client
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only dependencies
        run: python -m pip install pandas numpy requests cryptography
      - name: Probe 2020 known-good, failed and unattempted tickers
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import requests
          from collectors.price.kis_client import get_token, query
          from collectors.price.kis_adjusted_backfill import reference_year, calendar_windows, datekey

          key, secret = os.environ["KIS_APP_KEY"], os.environ["KIS_APP_SECRET"]
          session = requests.Session()
          token = get_token(session, key, secret, log_reuse=True)
          data = reference_year(2020)
          targets = ["005930", "223250", "223310", "224060", "226500"]
          rows = []
          for code in targets:
              source = data.loc[data["Code"].eq(code)]
              if source.empty:
                  print("KIS_PROBE="+json.dumps({"code":code,"result":"not_in_reference"}),flush=True)
                  continue
              windows = list(calendar_windows(source["Date"].min(),source["Date"].max()))
              picks = [windows[0]] if len(windows)==1 else [windows[0],windows[-1]]
              for first,last in picks:
                  interval = f"{datekey(first)}-{datekey(last)}"
                  try:
                      result = query(session,key,secret,token,code,
                                     datekey(first),datekey(last),adjusted=True)
                      record = {"code":code,"window":interval,"result":"success",
                                "returned_rows":len(result)}
                  except Exception as exc:
                      # Only the safe API code, no credentials, headers, bodies or bearer.
                      record = {"code":code,"window":interval,"result":"error",
                                "error_type":type(exc).__name__,
                                "safe_error":str(exc)[:100]}
                  rows.append(record)
                  print("KIS_PROBE="+json.dumps(record,ensure_ascii=False),flush=True)
                  time.sleep(1.1)
          print("KIS_PROBE_SUMMARY="+json.dumps({
              "successful_windows":sum(x["result"]=="success" for x in rows),
              "error_windows":sum(x["result"]=="error" for x in rows),
              "known_good_tested":any(x["code"]=="005930" for x in rows),
              "live_provider_health_conclusion":"manual_review_required"
          },ensure_ascii=False),flush=True)
          PY
