name: ML V1 Extension - Frozen Quarter Concentration 13
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-krx-v1-quarter-concentration-13
  cancel-in-progress: false
jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private frozen V1
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scikit-learn joblib
      - name: Synthetic regression guards
        working-directory: private
        run: python -m unittest validation.ml.test_v1_extension_quarter_concentration -v
      - name: Frozen parity and quarter concentration
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v1_extension_quarter_concentration_run | tee /tmp/v1-concentration.log
          python - <<'PY'
          import json
          from pathlib import Path
          line=next(x for x in Path('/tmp/v1-concentration.log').read_text().splitlines() if x.startswith('V1_QUARTER_CONCENTRATION_13='))
          data=json.loads(line.split('=',1)[1])
          assert data['sealed_2023_read'] is False
          assert all(data[k] is False for k in ('training_approved','point_in_time_verified','tradable_strategy_approved'))
          assert set(data['per_year'])=={'2019','2020','2021','2022'}
          assert [data['per_year'][y]['n'] for y in ('2019','2020','2021','2022')]==[226,224,226,221]
          for year,item in data['per_year'].items():
              q=item['concentration']
              assert sum(q['quarter_counts'])==q['top_n']
              assert sum(q['quarter_hits'])==q['top_hits']
              assert abs(q['top10_precision']-item['top10_precision'])<1e-6
              assert 1<=q['effective_quarters']<=4
          Path('/tmp/v1-quarter-concentration-13.json').write_text(json.dumps(data,indent=2)+'\n')
          print('V1_QUARTER_CONCENTRATION_13_GATES_PASS=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-quarter-concentration-13
          path: /tmp/v1-quarter-concentration-13.json
          retention-days: 14
