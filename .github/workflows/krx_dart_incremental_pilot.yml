name: KRX DART Incremental Pilot
on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Zero-based KRX batch index (ignored when auto_next=true)"
        required: true
        default: "0"
      auto_next:
        description: "Automatically select first incomplete batch (recommended)"
        type: boolean
        default: true
      batch_size:
        description: "Companies per batch (1-25)"
        required: true
        default: "25"
permissions:
  contents: read
concurrency:
  group: public-dart-incremental
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore most recent financial DB checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            data/financial_statements.pkl.gz
            data/dart_shards/
            data/unavailable_periods.json
          key: public-dart-financial-v1-${{ github.run_id }}
          restore-keys: |
            public-dart-financial-v1-
      - name: Reconstruct DB from split cache if needed
        run: python dart_checkpoint_shards.py restore
      - name: Validate restored DB
        run: |
          if [ -f data/financial_statements.pkl.gz ]; then
            python validate_financial_db.py
          fi
      - name: Check Python syntax and missing-cache contract
        run: |
          python -m py_compile collect_dart.py validate_financial_db.py select_next_batch.py dart_checkpoint_shards.py
          python tests/test_missing_cache_static.py
      - name: Collect KRX universe pilot
        env:
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          AUTO_NEXT: ${{ inputs.auto_next }}
        run: |
          if [ "$BATCH_SIZE" -lt 1 ] || [ "$BATCH_SIZE" -gt 25 ]; then
            echo "Batch limited to 1-25 companies"; exit 1
          fi
          if [ "$AUTO_NEXT" = "true" ]; then
            python select_next_batch.py --batch-size "$BATCH_SIZE" | tee /tmp/next_dart_batch.log
            BATCH_INDEX="$(python -c 'import json; print(json.loads(open("/tmp/next_dart_batch.log").read().split("AUTO_DART_BATCH=")[1])["batch_index"])')"
          fi
          echo "COLLECTING_BATCH_INDEX=$BATCH_INDEX"
          python collect_dart.py --batch-index "$BATCH_INDEX" --batch-size "$BATCH_SIZE" --workers 2
          python validate_financial_db.py
      - name: Split validated DB for cache
        if: success()
        run: python dart_checkpoint_shards.py split
      - name: Remove monolithic DB from cache staging
        if: success()
        run: |
          mkdir -p /tmp/dart_checkpoint
          cp data/financial_statements.pkl.gz /tmp/dart_checkpoint/financial_statements.pkl.gz
          rm data/financial_statements.pkl.gz
      - name: Save incremental checkpoint cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/dart_shards/
            data/unavailable_periods.json
          key: public-dart-financial-v1-${{ github.run_id }}
      - name: Restore combined DB for existing Private importer
        if: success()
        run: cp /tmp/dart_checkpoint/financial_statements.pkl.gz data/financial_statements.pkl.gz
      - name: Upload checkpoint artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krx-dart-checkpoint-${{ github.run_id }}
          path: |
            data/financial_statements.pkl.gz
            data/unavailable_periods.json
          retention-days: 30
