name: DART original filing lease audit (read only)
on:
  push:
    branches:
      - audit-2015-lease-original-20261128
    paths:
      - .github/workflows/dart_2015_lease_audit.yml
permissions:
  contents: read
jobs:
  inspect-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated private audit branch
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: audit-2015-lease-original-20261128
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan DART original documents without changing financial inputs
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python validation/financials/audit_2015_lease_original.py
      - name: Save report on private audit branch only
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- validation/financials/audit_2015_original_results/
          git diff --cached --quiet || git commit -m "Record independent DART original lease audit"
          git push origin HEAD:audit-2015-lease-original-20261128
