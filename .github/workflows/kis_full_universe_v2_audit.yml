name: KIS 전체종목 v2 입력 검증 (2010-2024)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kis_full_universe_v2_audit.yml'
permissions:
  contents: read
concurrency:
  group: kis-full-universe-v2-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas scikit-learn requests cryptography joblib
      - name: Test sealed year and segmentation
        working-directory: private
        run: python -m unittest validation.ml.test_kis_full_universe_v2 -v
      - name: Audit all historical eligible KIS symbols
        working-directory: private
        run: python -m analysis.ml.kis_full_universe_v2
      - name: Persist audit in PRIVATE repository only
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/kis_full_universe_v2/input_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record full-universe 2010-2024 KIS v2 input audit'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
