name: KRX ML - 2010 Unlabeled Discovery + Chronological Return Feedback

on:
  workflow_dispatch:
    inputs:
      stride:
        description: '종목별 주가 관측 간격(거래일)'
        type: number
        default: 5
        required: true
      max_fit:
        description: '2010~2021 비지도 KMeans 표본 상한 (첫 실행 75000)'
        type: number
        default: 75000
        required: true

permissions:
  contents: read

concurrency:
  group: krx-unlabeled-2010-return-feedback
  cancel-in-progress: false

jobs:
  chronological-return-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Checkout private market data and development sources
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Regression and synthetic historical 2010-2026 integration tests
        working-directory: private
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python -m unittest \
              validation.ml.test_unsupervised_feedback_2010 \
              validation.ml.test_unsupervised_temporal_hmm \
              validation.ml.test_unsupervised_regimes -v
      - name: Validate all 2010-2026 raw source files exist (read only)
        working-directory: private
        run: |
          python - <<'PY'
          from pathlib import Path
          hist = Path('data/historical_krx_2010_2014')
          regular = Path('data')
          missing = [
            str((hist if y < 2015 else regular) / f'market_{y}.pkl.gz')
            for y in range(2010, 2027)
            if not ((hist if y < 2015 else regular) /
                    f'market_{y}.pkl.gz').is_file()
          ]
          if missing:
              raise SystemExit(f'MISSING_2010_2026_PARTITIONS={missing}')
          print('FULL_HISTORY_2010_2026_PARTITIONS=17', flush=True)
          PY
      - name: Learn unlabeled 2010-2021 dynamics and matured-return feedback
        working-directory: private
        env:
          STRIDE: ${{ inputs.stride }}
          MAX_FIT: ${{ inputs.max_fit }}
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.unsupervised_feedback_2010 \
            --data-dir data \
            --historical-dir data/historical_krx_2010_2014 \
            --output-dir data/ml/unsupervised_feedback_2010_v1 \
            --end-year 2026 \
            --stride "$STRIDE" --max-fit "$MAX_FIT"
      - name: Save only new model and research files into private repository
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_feedback_2010_v1/
          if git diff --cached --quiet; then
            echo RETURN_FEEDBACK_ARTIFACTS_UNCHANGED=true
          else
            git commit -m 'Save private chronological 2010 unlabeled feedback research' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::RETURN_FEEDBACK_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo RETURN_FEEDBACK_PRIVATE_SAVED=true
          fi
# No scheduled/push trigger; manual run only.
# Earlier archive files, canonical market partitions and existing ML programs
# are read-only and are not included in the commit.
