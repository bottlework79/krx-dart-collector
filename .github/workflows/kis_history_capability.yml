name: KIS historical data and delisted-universe capability probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/kis_runs/start_kis_history_capability_20261117.flag'

permissions:
  contents: read

concurrency:
  group: kis-history-capability-public
  cancel-in-progress: false

jobs:
  history-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only historical read-only quote requirements
        run: python -m pip install pandas numpy requests
      - name: Check 2010 2014 2020 2026 prices and 2010 non-current universe
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          python -m collectors.price.kis_history_capability
      - name: Save capability report to private repository
        if: always()
        working-directory: private
        run: |
          set -euo pipefail
          path=data/adjusted_kis/capability_probe_20261117.json
          if [ ! -f "$path" ]; then
            echo KIS_HISTORY_PROBE_NO_REPORT=true
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save KIS historical 2010 and potentially delisted coverage probe'
          for try in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo '::error::History capability report could not be saved'
          exit 1
