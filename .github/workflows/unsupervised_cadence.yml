name: Unsupervised Regimes - 1 5 10 Day Observation Frequency

on:
  workflow_dispatch:
    inputs:
      validation_years:
        description: '검증 연도 (공백으로 구분)'
        required: false
        type: string
        default: '2022 2023 2024 2025'
  push:
    paths:
      - '.github/workflows/unsupervised_cadence.yml'

permissions:
  contents: read

concurrency:
  group: krx-regime-independent-frequency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private KRX prices and frozen 120/300 regimes
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compact CPU sklearn stack
        run: |
          python -m pip install numpy pandas scikit-learn joblib
      - name: Regression tests for original 120/300 and independent observation cadence
        working-directory: private
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m unittest \
            validation.ml.test_unsupervised_cadence \
            validation.ml.test_unsupervised_turn_lead \
            validation.ml.test_unsupervised_window_comparison \
            validation.ml.test_unsupervised_regimes -v
      - name: Validate 1 5 10 day causal transitions using original fixed year-fold models
        working-directory: private
        shell: bash
        env:
          YEARS: ${{ inputs.validation_years || '2022 2023 2024 2025' }}
        run: |
          set -euo pipefail
          read -ra selected_years <<< "$YEARS"
          if (( ${#selected_years[@]} == 0 )); then
            echo "::error::Select at least one year"
            exit 1
          fi
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.unsupervised_cadence \
            --years "${selected_years[@]}"
      - name: Persist only new frequency study outputs to private GitHub
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_cadence/
          if git diff --cached --quiet; then
            echo 'CADENCE_STUDY_NO_CHANGES=true'
          else
            git commit -m 'Save private 1-5-10 day regime cadence research results' >/dev/null
            git fetch origin main >/tmp/cadence_fetch.log 2>&1
            if ! git rebase origin/main >/tmp/cadence_rebase.log 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              echo '::error::CADENCE_REBASE_CONFLICT'
              exit 1
            fi
            if ! git push origin HEAD:main >/tmp/cadence_push.log 2>&1; then
              echo '::error::CADENCE_PUSH_FAILED'
              exit 1
            fi
            echo 'CADENCE_STUDY_PRIVATE_SAVED=true'
          fi

# Results are strictly isolated from KRX collection and all prior ML versions.
