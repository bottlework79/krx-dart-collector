name: Unsupervised Regimes - Matched 120 200 300 History

on:
  workflow_dispatch:
    inputs:
      validation_years:
        description: '검증 연도 (공백 구분)'
        required: false
        type: string
        default: '2022 2023 2024 2025'
  push:
    paths:
      - '.github/workflows/unsupervised_window_comparison.yml'

permissions:
  contents: read

concurrency:
  group: unsupervised-krx-window-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private KRX market DB and regime analysis
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight clustering dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Test original unsupervised model and matched-window regression
        working-directory: private
        run: |
          python -m unittest \
            validation.ml.test_unsupervised_regimes \
            validation.ml.test_unsupervised_window_comparison \
            -v
      - name: Train 120 200 300-day regimes with identical 300-day-history cohorts
        working-directory: private
        shell: bash
        env:
          YEARS: ${{ inputs.validation_years || '2022 2023 2024 2025' }}
        run: |
          set -euo pipefail
          read -ra selected_years <<< "$YEARS"
          if (( ${#selected_years[@]} == 0 )); then
            echo "::error::At least one validation year required"
            exit 1
          fi
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.unsupervised_window_comparison \
            --validation-years "${selected_years[@]}" \
            --stride 10 --clusters 6 --max-fit-samples 100000 --seed 42
      - name: Commit only the new private matched-window experiment directory
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_window_comparison/
          if git diff --cached --quiet; then
            echo 'REGIME_WINDOW_COMPARISON_UNCHANGED'
          else
            git commit -m 'Save private 120/200/300 OHLCV matched-cohort regime comparison' >/dev/null
            git fetch origin main >/tmp/regime_window_fetch.log 2>&1
            if ! git rebase origin/main >/tmp/regime_window_rebase.log 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              echo '::error::REGIME_WINDOW_COMPARISON_REBASE_CONFLICT'
              exit 1
            fi
            if ! git push origin HEAD:main >/tmp/regime_window_push.log 2>&1; then
              echo '::error::REGIME_WINDOW_COMPARISON_PUSH_FAILED'
              exit 1
            fi
            echo 'REGIME_WINDOW_COMPARISON_PRIVATE_SAVED=true'
          fi

# Only a new experimental result path is modified. No production models,
# historical KRX prices, or the original 200-day unsupervised results are changed.
