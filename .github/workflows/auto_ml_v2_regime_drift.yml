name: ML V2 - Frozen KRX Price Feature Regime Drift Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ml_research/v2_regime_drift_20261120.flag'

permissions:
  contents: read

concurrency:
  group: ml-v2-regime-drift-readonly
  cancel-in-progress: false

jobs:
  diagnose-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout pinned private V1 original price shards read-only
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          path: private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only scientific dependencies
        run: python -m pip install pandas numpy scikit-learn joblib
      - name: Regress V2 as-of drift calculations and holdout exclusion
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_v2_regime_drift -v
      - name: Run frozen V1 2019-2021 KRX regime drift experiment
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.v2_regime_drift \
            --input-dir data/ml/auto_research_v1 \
            --output /tmp/v2_regime_drift.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/v2_regime_drift.json').read_text())
          assert obj["development_years"]==[2019,2020,2021]
          assert not obj["sealed_year_used"]
          assert obj["fold_counts"]=={"2019":679,"2020":675,"2021":747}
          assert not obj["training_approved"] and not obj["point_in_time_verified"]
          assert not obj["tradable_strategy_approved"]
          assert obj["shared_symbol_count"]>=5
          print("V2_PRICE_REGIME_DRIFT_V1_FOLD_PARITY_PASS=true")
          PY
      - name: Upload fixed-cohort descriptive research metrics (no private mutations)
        uses: actions/upload-artifact@v4
        with:
          name: v2-frozen-krx-price-regime-drift
          path: /tmp/v2_regime_drift.json
          if-no-files-found: error
          retention-days: 14

# 2023 sealed validation not used. No new model fitting or operating orders.
