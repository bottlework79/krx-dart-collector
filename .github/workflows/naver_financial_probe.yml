name: Naver Financial JSON Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/naver_financial_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout private project
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Install existing DART parser dependency
        run: python3 -m pip install lxml
      - name: Compare Naver reported EV EBITDA to reconstructed EV
        working-directory: private
        run: |
          python3 -m unittest test.test_ev_ebitda_ttm -v
          python3 -u -m operations.ev_ebitda_ttm_source_audit
      - name: Reuse existing original filing D&A parser for three periods
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -u -m operations.ev_da_three_period_audit # read-only combined D&A TTM calculation audit; quarterly TTM unit tests

