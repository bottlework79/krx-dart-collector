name: Reversal Ensemble - OOS Fusion Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reversal-ensemble-audit-private
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private walk-forward OOS data and audit code
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight audit dependencies
        run: python -m pip install pandas numpy scikit-learn
      - name: Test fixed-blend audit with synthetic examples
        working-directory: private
        run: python -m unittest validation.ml.test_reversal_ensemble_audit -v
      - name: Recalculate four-year out-of-sample ensemble metrics
        working-directory: private
        run: python -m analysis.ml.reversal_ensemble_audit --years 2022 2023 2024 2025
      - name: Commit only ensemble analysis to private repository
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/reversal_ensemble_audit/
          if git diff --cached --quiet; then
            echo 'ENSEMBLE_AUDIT_UNCHANGED=true'
          else
            git commit -m 'Update independent V2 ensemble OOS score audit' > /dev/null
            git fetch origin main > /tmp/ensemble_fetch.log 2>&1
            if ! git rebase origin/main > /tmp/ensemble_rebase.log 2>&1; then
              git rebase --abort > /dev/null 2>&1 || true
              echo '::error::ENSEMBLE_AUDIT_REBASE_CONFLICT'
              exit 1
            fi
            if ! git push origin HEAD:main > /tmp/ensemble_push.log 2>&1; then
              echo '::error::ENSEMBLE_AUDIT_PUSH_FAILED'
              exit 1
            fi
            echo 'ENSEMBLE_AUDIT_PRIVATE_SAVED=true'
          fi
# No CNN retraining or operational score changes. No per-symbol OOS rows in public artifacts.
