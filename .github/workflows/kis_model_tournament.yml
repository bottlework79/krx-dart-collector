name: KIS주가 다중모델 연구 토너먼트

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kis_model_tournament.yml'

permissions:
  contents: read

concurrency:
  group: kis-research-model-tournament
  cancel-in-progress: false

jobs:
  run-broad-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout private KIS research dataset and model code
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline model research dependencies
        run: python -m pip install pandas numpy scikit-learn joblib requests cryptography xgboost lightgbm catboost
      - name: Rank models on full 2017-2022 KIS samples, never reading 2023
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.kis_model_tournament
      - name: Persist exploratory private rankings, no models or raw prices
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/kis_chatgpt_bridge_v1/tournament/
          if git diff --cached --quiet; then
            echo KIS_TOURNAMENT_UNCHANGED=true
          else
            git commit -m 'Record KIS broad model comparison research-only metrics' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::KIS_TOURNAMENT_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo KIS_TOURNAMENT_SAVED=true
          fi

# Training here runs inside GitHub, not ChatGPT. The ChatGPT hourly automation
# separately runs its own local Python research when the environment allows.
