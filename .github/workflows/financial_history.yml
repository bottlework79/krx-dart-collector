name: Query Financial Processing History
on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '6-digit stock code (blank = all)'
        required: false
        default: '007860'
        type: string
      year:
        description: 'Fiscal year (blank = all)'
        required: false
        default: ''
        type: string
      report:
        description: 'q1, half, q3, annual (blank = all)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
      - name: Query stored stage coverage
        working-directory: private
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          YEAR: ${{ inputs.year }}
          REPORT: ${{ inputs.report }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$STOCK_CODE" ]]; then args+=(--code "$STOCK_CODE"); fi
          if [[ -n "$YEAR" ]]; then args+=(--year "$YEAR"); fi
          if [[ -n "$REPORT" ]]; then args+=(--report "$REPORT"); fi
          python -m analysis.financials.processing_history "${args[@]}"
