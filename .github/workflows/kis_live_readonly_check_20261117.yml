name: KIS 2026-11-17 Live Read-only OAuth Cache Validation

on:
  push:
    paths:
      - '.github/kis_verification/run_20261117.flag'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kis-auth-single-writer
  cancel-in-progress: false

jobs:
  live-token-check:
    name: Authenticate once and verify 002070 adjusted quote and private cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated quote requirements
        run: python -m pip install requests cryptography pandas numpy
      - name: Run offline token and pricing regressions
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest \
            validation.prices.test_kis_client \
            validation.prices.test_kis_adjusted_backfill \
            validation.prices.test_kis_adjusted_sync \
            validation.prices.test_kis_investor_flow -q
      - name: Live KIS adjusted quote and encrypted cache validation
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests
          from pathlib import Path
          import pandas as pd
          from collectors.price.kis_client import get_token, query, require, CACHE

          session=requests.Session()
          key=require("KIS_APP_KEY")
          secret=require("KIS_APP_SECRET")
          existed=CACHE.is_file()
          token=get_token(session,key,secret,log_reuse=True)
          print("KIS_CACHE_EXISTED_BEFORE_RUN="+str(existed).lower(),flush=True)
          rows=query(session,key,secret,token,
                     "002070","20260401","20260515",adjusted=True)
          dates={r["date"]:r for r in rows}
          required=["20260407","20260508"]
          if any(d not in dates for d in required):
            raise RuntimeError("KIS 2026 corporate-action dates unavailable")
          opens=[int(dates[d]["open"]) for d in required]
          if any(x<=0 for x in opens):
            raise RuntimeError("KIS adjusted open must be positive")
          if not CACHE.is_file():
            raise RuntimeError("Encrypted KIS token cache was not persisted")
          envelope=json.loads(CACHE.read_text(encoding="utf-8"))
          if sorted(envelope.keys())!=["ciphertext","version"]:
            raise RuntimeError("Private encrypted cache envelope invalid")
          private_year=Path("data/adjusted_kis/shards/market_2026.pkl.gz")
          compared=None
          if private_year.is_file():
            prior=pd.read_pickle(private_year,compression="gzip")
            prior=prior.loc[prior["Code"].eq("002070")].set_index("Date")
            prior_opens=[int(prior.loc[pd.Timestamp(d),"Open"])
                         for d in ["2026-04-07","2026-05-08"]]
            compared=(prior_opens==opens)
            if not compared:
              raise RuntimeError("Current KIS adjusted quotes differ from staged private 2026 prices; initiate a full-year rebase")
          print("KIS_LIVE_READ_ONLY_VERIFIED="+json.dumps({
             "code":"002070","dates":required,"adjusted_open":opens,
             "bars":len(rows),"matches_private_staged_2026":compared,
             "encrypted_cache_written":True,"krx_original_modified":False,
             "orders_submitted":False,
          },ensure_ascii=False),flush=True)
          PY
      - name: Live 2026 KIS daily monitor with an isolated temporary stage
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          import tempfile
          from pathlib import Path
          from collectors.price.kis_adjusted_sync import monitor

          source = Path("data/adjusted_kis")
          with tempfile.TemporaryDirectory() as d:
            tmp=Path(d)/"adjusted_kis"
            for folder in ("shards", "manifests"):
              (tmp/folder).mkdir(parents=True,exist_ok=True)
              filename=("market_2026.pkl.gz" if folder=="shards"
                        else "market_2026.json")
              shutil.copy2(source/folder/filename,tmp/folder/filename)
            outcome=monitor(year=2026,selected_codes=["002070"],
                            data_dir="data",root=tmp,
                            sleep_secs=0.0)
            if outcome["monitored"]!=1:
              raise RuntimeError("KIS staged 2026 monitor did not check 002070")
            if outcome["queued_rebases"]!=0:
              raise RuntimeError("KIS monitor left an unresolved adjustment rebase")
            print("KIS_LIVE_DAILY_MONITOR_VERIFIED="+json.dumps(
              outcome,ensure_ascii=False),flush=True)
          PY
      - name: Probe optional KIS investor-flow endpoint without mutating data
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests
          from collectors.price.kis_client import get_token,require
          from collectors.price.kis_investor_flow import query_investor, normalize_investor
          s=requests.Session()
          key,secret=require("KIS_APP_KEY"),require("KIS_APP_SECRET")
          token=get_token(s,key,secret,log_reuse=True)
          try:
            rows=query_investor(s,key,secret,token,"005930")
            if not rows:
              raise RuntimeError("KIS investor API returned no rows")
            parsed=normalize_investor("005930",rows)
            if parsed.empty:
              raise RuntimeError("KIS investor rows could not be normalized")
            print("KIS_INVESTOR_LIVE_VERIFIED="+json.dumps({
              "code":"005930","rows":len(parsed),
              "first":str(parsed.Date.min().date()),
              "last":str(parsed.Date.max().date()),
              "columns":list(parsed.columns),
              "private_data_modified":False,
            },ensure_ascii=False),flush=True)
          except Exception as error:
            # Optional experimental dataset, not required for OHLCV pipeline.
            print("KIS_INVESTOR_LIVE_UNVERIFIED="+json.dumps({
              "error_type":type(error).__name__,
              "error_description":str(error)[:160],
              "price_collector_affected":False,
            },ensure_ascii=False),flush=True)
          PY
      - name: Commit encrypted token checkpoint privately even if quote fails
        if: always()
        working-directory: private
        run: |
          set -euo pipefail
          path=data/adjusted_kis/auth/token.enc.json
          if [ ! -f "$path" ]; then
            echo KIS_NO_ENCRYPTED_TOKEN_CACHE_TO_CHECKPOINT=true
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$path"
          if git diff --cached --quiet; then
            echo KIS_TOKEN_CACHE_PRIVATE_UNCHANGED=true
            exit 0
          fi
          git commit -m 'Store KIS encrypted access token for 24h cross-run reuse'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Cannot safely rebase encrypted token cache"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo KIS_TOKEN_CACHE_PERSISTED_PRIVATE=true
              exit 0
            fi
            sleep 3
          done
          echo "::error::Token encryption succeeded but private checkpoint failed"
          exit 1
