name: Chart Pattern Screening

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: '차트 패턴 선택'
        required: true
        type: choice
        options:
          - double_bottom
          - double_top
          - triangle
          - rectangle
          - cup_with_handle
          - large_saucer
      stock_code:
        description: '종목코드 6자리 (비우면 전체)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run selected chart pattern
        working-directory: private
        env:
          PATTERN: ${{ inputs.pattern }}
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          set -euo pipefail
          if [[ -n "$STOCK_CODE" ]]; then
            python -m analysis.patterns.run --pattern "$PATTERN" --code "$STOCK_CODE"
          else
            python -m analysis.patterns.run --pattern "$PATTERN"
          fi
