name: ML V1 Extension - Frozen Calendar Quarter Block Sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ml_research/v1_calendar_block_20261120.flag'

permissions:
  contents: read

concurrency:
  group: private-krx-v1-calendar-block-audit
  cancel-in-progress: false

jobs:
  readonly-calendar-block:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable private research source
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install pandas numpy scikit-learn joblib
      - name: Synthetic regression guards
        working-directory: private
        run: python -m unittest validation.ml.test_v1_extension_calendar_block -v
      - name: Frozen 2019-2022 KRX fold parity and shared quarter sensitivity
        working-directory: private
        run: |
          set -euo pipefail
          mkdir -p /tmp/v1-calendar-audit
          python -m analysis.ml.v1_extension_calendar_block | tee /tmp/v1-calendar-audit/run.log
          grep -q '^V1_QUARTER_BLOCK_UNCERTAINTY=' /tmp/v1-calendar-audit/run.log
          python - <<'PY'
          import json
          from pathlib import Path
          line=next(x for x in Path('/tmp/v1-calendar-audit/run.log').read_text().splitlines() if x.startswith('V1_QUARTER_BLOCK_UNCERTAINTY='))
          data=json.loads(line.split('=',1)[1])
          assert data['sealed_2023_read'] is False
          assert all(data[k] is False for k in ('training_approved','point_in_time_verified','tradable_strategy_approved'))
          assert set(data['per_year'])=={'2019','2020','2021','2022'}
          assert [data['per_year'][y]['nonoverlap_n'] for y in ('2019','2020','2021','2022')]==[226,224,226,221]
          assert all(data['per_year'][y]['quarter_block_uncertainty']['blocks']==4 for y in data['per_year'])
          Path('/tmp/v1-calendar-audit/report.json').write_text(json.dumps(data,indent=2)+'\n')
          print('V1_CALENDAR_BLOCK_GATES_PASS=true')
          PY
      - name: Upload read-only aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: v1-calendar-quarter-sensitivity
          path: /tmp/v1-calendar-audit/report.json
          if-no-files-found: error
