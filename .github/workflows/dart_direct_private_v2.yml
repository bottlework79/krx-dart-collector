name: DART Direct Private V2 Pilot
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "New companies per run (1-25)"
        required: true
        default: "2"
permissions:
  contents: write
concurrency:
  group: dart-direct-private-v2
  cancel-in-progress: false
jobs:
  collect-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: true
      - name: Checkout private storage with limited secret
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: private
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verify scripts
        working-directory: private
        run: |
          python -m py_compile financial_data/*.py
          python -m unittest test.test_ev_ebitda_ttm -v
      - name: Select and collect unimported reports
        working-directory: private
        env:
          DART_COLLECTION_DIR: ../scratch
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || [ "$BATCH_SIZE" -lt 1 ] || [ "$BATCH_SIZE" -gt 25 ]; then
            echo "Invalid batch size"; exit 1
          fi
          python -m financial_data.select_history_batch --batch-size "$BATCH_SIZE" --universe ../public/data/krx_universe.json --history ../public/data/dart_collection_history.json > /tmp/dart_v2_selection.log
          # Selection output contains only aggregate batch metadata.
          BATCH_INDEX="$(python -c 'import json; print(json.loads(open("/tmp/dart_v2_selection.log").read().split("AUTO_DART_BATCH=")[1])["batch_index"])')"
          python -m financial_data.collect_dart --batch-index "$BATCH_INDEX" --batch-size "$BATCH_SIZE" --workers 3 --universe-file ../public/data/krx_universe.json --history-file ../public/data/dart_collection_history.json
          python -m financial_data.validate_financial_db --db ../scratch/financial_statements.pkl.gz --universe ../public/data/financial_universe.json
      - name: Merge fresh batch into Private v2
        working-directory: private
        run: |
          python -m financial_data.merge_private_v2 --batch ../scratch/financial_statements.pkl.gz --private-db data/financial_statements_v2.pkl.gz --universe ../public/data/krx_universe.json
      - name: Commit verified Private v2 data
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financial_statements_v2.pkl.gz
          if ! git diff --cached --quiet; then
            git commit -m "Import newly collected DART batch into private v2"
            git push origin HEAD:main
          fi
      - name: Rebuild public metadata only after Private push
        working-directory: private
        run: |
          python -m financial_data.build_dart_history --private-db data/financial_statements_v2.pkl.gz --missing ../scratch/unavailable_periods.json --universe ../public/data/krx_universe.json --output ../public/data/dart_collection_history.json
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path("../public/data/dart_collection_history.json").read_text())
          assert all(v["status"] in ("imported","unavailable") for v in h["entries"].values())
          print("PUBLIC_HISTORY_ENTRIES",len(h["entries"]))
          PY
      - name: Commit Public collection history
        working-directory: public
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart_collection_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DART imported coverage after Private v2 verification"
            git push origin HEAD:main
          fi
