name: DART Direct Private V2 Pilot
on:
  push:
    branches: [main, 'test/private-financial-separation']
    paths:
      - '.github/dart-pilot-trigger.txt'
      - '.github/workflows/dart_direct_private_v2.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "New companies per run (1-25)"
        required: true
        default: "2"
permissions:
  contents: write
concurrency:
  group: dart-direct-private-v2
  cancel-in-progress: false
jobs:
  collect-and-import:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
        with:
          path: public
          persist-credentials: true
      - name: Checkout private storage with limited secret
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: private
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verify scripts
        working-directory: private
        run: |
          python -m py_compile financial/*.py
          python -m unittest test.test_ev_ebitda_ttm -v
          python - <<'PY'
          import importlib
          names = ['diagnose_financial_missing', 'diagnose_missing_metric_sources', 'diagnose_missing_parent_raw', 'diagnose_parent_net_semantics', 'diagnose_quarterly_parent_discrepancies', 'diagnose_unresolved_parent_profit']
          for name in names:
              old = importlib.import_module('operations.' + name)
              new = importlib.import_module('research.financial.' + name)
              assert callable(old.main) and old.main is new.main, name
          print('XBRL_COMPATIBILITY_OK', len(names))
          PY
          python -c 'import operations.current_other_multiples_pilot, operations.financial_score_fnguide_pilot; from research.financial import current_other_multiples_pilot, financial_score_fnguide_pilot; assert callable(current_other_multiples_pilot.main) and callable(financial_score_fnguide_pilot.main)'
      - name: Select and collect unimported reports
        working-directory: private
        env:
          DART_COLLECTION_DIR: ../scratch
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '1' }}
        run: |
          set -euo pipefail
          if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || [ "$BATCH_SIZE" -lt 1 ] || [ "$BATCH_SIZE" -gt 25 ]; then
            echo "Invalid batch size"; exit 1
          fi
          python -m financial.select_history_batch --batch-size "$BATCH_SIZE" --universe ../public/data/krx_universe.json --history ../public/data/dart_collection_history.json > /tmp/dart_v2_selection.log
          # Selection output contains only aggregate batch metadata.
          BATCH_INDEX="$(python -c 'import json; print(json.loads(open("/tmp/dart_v2_selection.log").read().split("AUTO_DART_BATCH=")[1])["batch_index"])')"
          python -m financial.collect_dart --batch-index "$BATCH_INDEX" --batch-size "$BATCH_SIZE" --workers 3 --universe-file ../public/data/krx_universe.json --history-file ../public/data/dart_collection_history.json
          python -m financial.validate_financial_db --db ../scratch/financial_statements.pkl.gz --universe ../public/data/krx_universe.json
      - name: Merge fresh batch into Private v2
        working-directory: private
        run: |
          python -m financial.merge_private_v2 --batch ../scratch/financial_statements.pkl.gz --private-db data/financial_statements_v2.pkl.gz --universe ../public/data/krx_universe.json
      - name: Commit verified Private v2 data
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financial_statements_v2.pkl.gz
          if ! git diff --cached --quiet; then
            git commit -m "Import newly collected DART batch into private v2"
            git push origin HEAD:main
          fi
      - name: Rebuild public metadata only after Private push
        working-directory: private
        run: |
          python -m financial.build_dart_history --private-db data/financial_statements_v2.pkl.gz --missing ../scratch/unavailable_periods.json --universe ../public/data/krx_universe.json --output ../public/data/dart_collection_history.json
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path("../public/data/dart_collection_history.json").read_text())
          assert all(v["status"] in ("imported","unavailable") for v in h["entries"].values())
          print("PUBLIC_HISTORY_ENTRIES",len(h["entries"]))
          PY
      - name: Commit Public collection history
        working-directory: public
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart_collection_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DART imported coverage after Private v2 verification"
            git push origin HEAD:main
          fi

  validate-migration:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private financial package migration branch
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: refactor/financial-diagnostics-phase5
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests lxml
      - name: Validate private financial modules
        run: |
          python -m compileall -q financial operations research/financial
          python -m unittest test.test_ev_ebitda_ttm -v
          python -m financial.collect_dart --help > /dev/null
          python -m financial.select_history_batch --help > /dev/null
          python -m financial.merge_private_v2 --help > /dev/null
          python -m financial.build_dart_history --help > /dev/null
          python -m financial.validate_financial_db --help > /dev/null
      - name: Read-only one-company DART collection smoke test
        if: false
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_COLLECTION_DIR: ${{ runner.temp }}/financial-smoke
        run: |
          python -m financial.collect_dart --batch-index 0 --batch-size 1 --workers 1 --start-year 2025 --end-year 2025 --universe-file data/financial_universe.json
          python -m financial.validate_financial_db --db "${DART_COLLECTION_DIR}/financial_statements.pkl.gz" --universe data/financial_universe.json
