name: Official KRX Current PER Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official_krx_per_pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private project
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private DB dependencies
        run: pip install pandas numpy
      # Recheck expanded private DART coverage after verified batch import.
      - name: Validate source
        working-directory: private
        run: python -m py_compile operations/krx_openapi_caps.py operations/current_ttm_per_snapshot.py
      # Audit filing receipt coverage for targeted XBRL; no financial DB changes.
      # Read-only candidate ROE/FCF check; never promote to verified scores.
      - name: Audit latest annual ROE and FCF input coverage
        working-directory: private
        run: python -m operations.audit_current_ratio_coverage
      - name: Calculate provisional PBR PSR FCF yield from official KRX
        working-directory: private
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python -m operations.current_other_multiples_pilot
      # Validate KR Motors DART note 22 amount and label in the same HTML row.
      - name: Smoke test one original XBRL filing without exposing company data
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m operations.ev_xbrl_smoke
      - name: Calculate private PER with official KRX API
        working-directory: private
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set +e
          python -m operations.current_ttm_per_snapshot --krx-openapi > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "OFFICIAL_KRX_PER_RUN_FAILED=1"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("dart_results/current_valuation/current_ttm_per_summary.json").read_text())
          d=r.get("quote_diagnostics", {})
          a=d.get("openapi", {})
          keys=("requests","http_errors","response_errors","empty_responses","valid_rows","duplicate_tickers")
          if any(type(a.get(k)) is not int or a[k]<0 for k in keys):
              raise SystemExit("INVALID_API_STATS")
          if any(type(d.get(k)) is not int or d[k]<0 for k in ("openapi_eligible","openapi_matched")):
              raise SystemExit("INVALID_MATCH_STATS")
          if type(r.get("per_available")) is not int:
              raise SystemExit("INVALID_PER_STATS")
          for k in keys:
              print("OFFICIAL_KRX_"+k.upper()+"="+str(a[k]))
          status=a.get("http_status", {})
          network=a.get("network_error_types", {})
          permitted_status={"400","401","403","404","405","408","429","500","502","503","504","other"}
          permitted_network={"URLError","TimeoutError","OSError","ValueError","Other"}
          if not isinstance(status,dict) or not isinstance(network,dict):
              raise SystemExit("INVALID_HTTP_DIAGNOSTICS")
          if any(k not in permitted_status or type(v) is not int or v<0 for k,v in status.items()):
              raise SystemExit("INVALID_HTTP_STATUS_COUNTS")
          if any(k not in permitted_network or type(v) is not int or v<0 for k,v in network.items()):
              raise SystemExit("INVALID_NETWORK_ERROR_COUNTS")
          if sum(status.values())+sum(network.values()) != a["http_errors"]:
              raise SystemExit("UNBALANCED_HTTP_ERRORS")
          for k in sorted(status):
              print("OFFICIAL_KRX_HTTP_STATUS_"+k+"="+str(status[k]))
          for k in sorted(network):
              print("OFFICIAL_KRX_NETWORK_ERROR_"+k.upper()+"="+str(network[k]))
          print("OFFICIAL_KRX_ELIGIBLE="+str(d["openapi_eligible"]))
          print("OFFICIAL_KRX_MATCHED="+str(d["openapi_matched"]))
          print("OFFICIAL_KRX_PER_AVAILABLE="+str(r["per_available"]))
          if a["http_errors"] or a["response_errors"] or d["openapi_matched"] == 0 or r["per_available"] == 0:
              raise SystemExit("OFFICIAL_KRX_PER_NOT_READY")
          PY
