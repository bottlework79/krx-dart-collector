name: KIS Adjusted OHLCV - historical, daily monitor and encrypted token reuse

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [batch, monitor, refresh, investor, stats, backfill_auto, quality]
        default: stats
        required: true
        description: "batch: single-year; backfill_auto: 2010-2026 resume; quality: offline data audit; monitor/refresh/investor/stats"
      year:
        type: number
        default: 2026
        required: true
        description: "2010 through present"
      max_codes:
        type: number
        default: 500
        required: true
        description: "historical batch max 500; monitor stock count"
      codes:
        type: string
        default: ''
        required: false
        description: "Optional comma-separated six-digit codes; required for refresh"
  # Restored 2026-11-20 at user's request: weekday 18:30 KST
  # (09:30 UTC) follows 16:30 KST KRX daily refresh.
  # KIS price sync and investor-flow history share kis-auth-single-writer.
  schedule:
    - cron: '30 9 * * 1-5'
  # Historical backfill keeps its separate workflow_dispatch chain.
  push:
    paths:
      - '.github/kis_runs/backfill_now_20261117.flag'

permissions:
  contents: read
  actions: write

concurrency:
  group: kis-auth-single-writer
  cancel-in-progress: false

jobs:
  kis-adjusted:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout private KRX reference and KIS code
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only data dependencies
        run: python -m pip install pandas numpy requests cryptography
      - name: Run KIS offline unit and token security regressions
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest \
            validation.prices.test_kis_client \
            validation.prices.test_kis_adjusted_backfill \
            validation.prices.test_kis_adjusted_sync \
            validation.prices.test_kis_investor_flow \
            validation.prices.test_kis_quality_scheduler -v
      - name: Execute requested KIS action, no order endpoints
        id: collect
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'RUN_KIS_BACKFILL_NOW_20261117')
        working-directory: private
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          year="${{ inputs.year }}"
          count="${{ inputs.max_codes }}"
          codes="${{ inputs.codes }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Scheduled mode is explicit: workflow_dispatch default is stats.
            # Running after the KRX daily update enables same-day matching.
            mode=daily
            year=$(date -u +%Y)
            count=20
            codes=""
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            mode=backfill_auto
            year=2010
            count=1  # Historical one-symbol bootstrap; then 500 on the chain.
          fi
          if [ -z "$mode" ]; then mode=stats; fi
          if [ -z "$year" ]; then year=$(date -u +%Y); fi
          if [ -z "$count" ]; then count=20; fi
          if ! [[ "$year" =~ ^20[0-9]{2}$ ]] || (( year < 2010 || year > $(date -u +%Y) )); then
            echo "::error::Invalid KIS year"
            exit 1
          fi
          if ! [[ "$count" =~ ^[0-9]+$ ]] || (( count < 1 || count > 5000 )); then
            echo "::error::max_codes must be 1..5000"
            exit 1
          fi
          if [ -n "$codes" ] && ! [[ "$codes" =~ ^[0-9]{6}(,[0-9]{6})*$ ]]; then
            echo "::error::codes must be comma-separated six-digit values"
            exit 1
          fi
          echo "KIS_COLLECTION_MODE=$mode year=$year"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "backfill_auto" ]; then
            python -m collectors.price.kis_backfill_scheduler \
              --max-codes "$count" --sleep-seconds 1.0
          elif [ "$mode" = "quality" ]; then
            python -m collectors.price.kis_quality
          elif [ "$mode" = "stats" ]; then
            python -m collectors.price.kis_adjusted_backfill \
              --year "$year" --stats-only
          elif [ "$mode" = "batch" ]; then
            if [ -n "$codes" ]; then
              python -m collectors.price.kis_adjusted_backfill \
                --year "$year" --max-codes "$count" --codes "$codes" --sleep-seconds 0.65
            else
              python -m collectors.price.kis_adjusted_backfill \
                --year "$year" --max-codes "$count" --sleep-seconds 0.65
            fi
          elif [ "$mode" = "monitor" ]; then
            if [ -n "$codes" ]; then
              python -m collectors.price.kis_adjusted_sync \
                --year "$year" --max-codes "$count" --codes "$codes" --sleep-seconds 0.65
            else
              python -m collectors.price.kis_adjusted_sync \
                --year "$year" --max-codes "$count" --sleep-seconds 0.65
            fi
          elif [ "$mode" = "refresh" ]; then
            if [ -z "$codes" ]; then
              echo "::error::refresh requires explicit six-digit codes"
              exit 1
            fi
            python -m collectors.price.kis_adjusted_backfill \
              --year "$year" --max-codes "$count" \
              --codes "$codes" --force-refresh --sleep-seconds 0.65
          elif [ "$mode" = "investor" ]; then
            # KIS only returns a recent window; this cannot backfill 2010 data.
            if [ -n "$codes" ]; then
              python -m collectors.price.kis_investor_flow \
                --year "$year" --max-codes "$count" --codes "$codes"
            else
              python -m collectors.price.kis_investor_flow \
                --year "$year" --max-codes "$count"
            fi
          elif [ "$mode" = "daily" ]; then
            # Bootstrap a bounded KIS batch then monitor staged names.
            # The KRX daily job remains independent and authoritative.
            python -m collectors.price.kis_adjusted_backfill \
              --year "$year" --max-codes "$count" --sleep-seconds 0.65
            python -m collectors.price.kis_adjusted_sync \
              --year "$year" --max-codes 5000 --sleep-seconds 0.65
          else
            echo "::error::Unknown collection mode"
            exit 1
          fi
      - name: Validate staged 2010-2026 KIS coverage and data integrity
        if: always()
        working-directory: private
        run: |
          set -euo pipefail
          python -m collectors.price.kis_quality

      - name: Persist encrypted token and adjusted staging to PRIVATE repository
        if: always()
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for item in \
            data/adjusted_kis/auth/token.enc.json \
            data/adjusted_kis/shards \
            data/adjusted_kis/manifests \
            data/adjusted_kis/reports \
            data/adjusted_kis/corporate_action_refresh_queue.json \
            data/kis_investor_flow/shards \
            data/kis_investor_flow/manifests; do
            if [ -e "$item" ]; then git add -f -- "$item"; fi
          done
          for item in data/adjusted_kis/monitor_cursor_*.json; do
            if [ -f "$item" ]; then git add -f -- "$item"; fi
          done
          if git diff --cached --quiet; then
            echo KIS_NO_PRIVATE_CHECKPOINT_CHANGES=true
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          for path in Path('data/adjusted_kis/shards').glob('*.pkl.gz'):
              if path.stat().st_size > 95 * 1024 * 1024:
                  raise SystemExit('KIS yearly shard exceeds 95MiB: '+path.name)
          PY
          git commit -m 'Checkpoint KIS adjusted prices, monitor and encrypted token'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::KIS checkpoint conflict, no force push"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo KIS_STAGING_AND_ENCRYPTED_AUTH_SAVED_PRIVATE=true
              exit 0
            fi
            sleep 5
          done
          echo "::error::KIS private checkpoint push failed"
          exit 1

      - name: Check remaining KIS 2010-2026 work after private checkpoint
        id: next_backfill
        if: success() && steps.collect.outputs.mode == 'backfill_auto'
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collectors.price.kis_backfill_scheduler import choose_next
          pending = choose_next()
          more = pending.get("year") is not None
          # A false result means no *eligible* work now; errors under
          # 24-hour cooldown or partial/unavailable tickers still need audit.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("has_more=" + str(more).lower() + "\n")
          print("KIS_CHAIN_NEXT_PLAN=" + json.dumps({
              "has_more": more,
              "next_year": pending.get("year"),
              "selection_policy": pending["selection_policy"],
              "unattempted_in_next_year": pending.get("remaining_unattempted", 0),
              "ready_for_machine_learning": False,
          }, ensure_ascii=False), flush=True)
          PY

      - name: Immediately dispatch next 500-symbol KIS batch
        if: success() && github.run_attempt == 1 && steps.next_backfill.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub GITHUB_TOKEN actions:write may dispatch its own workflow.
          # This happens only after successful quality + PRIVATE data commit.
          gh workflow run kis_adjusted_history.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f mode=backfill_auto -f year=2010 -f max_codes=500
          echo "KIS_NEXT_BATCH_DISPATCH_ACCEPTED=true"

      - name: No eligible KIS backfill remains
        if: success() && steps.collect.outputs.mode == 'backfill_auto' && steps.next_backfill.outputs.has_more == 'false'
        run: |
          echo "KIS_BACKFILL_NO_ELIGIBLE_CODES=true"
          echo "No eligible 2010-2026 code-year remains now. Verify partial/unavailable/error and 24h cooldown in private QA before calling the archive complete."

# No credentials or prices are published. Current KRX and ML DBs untouched.
