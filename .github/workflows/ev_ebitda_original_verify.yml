name: EV EBITDA Original Integration Test (Public Runner)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ev_ebitda_original_verify.yml'
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run EV EBITDA original integration tests
        working-directory: private
        run: python -m unittest discover -s validation/financials -p 'test_dart_original_integration.py' -v
