name: Unsupervised 120 300 Combined - Trough Lead Validation

on:
  workflow_dispatch:
    inputs:
      validation_years:
        description: '사후 검증 연도 (공백 구분)'
        required: false
        type: string
        default: '2022 2023 2024 2025'
  push:
    paths:
      - '.github/workflows/unsupervised_turn_lead.yml'

permissions:
  contents: read

concurrency:
  group: unsupervised-krx-120-300-turn-lead
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private KRX prices and frozen 120/300 year-fold outputs
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install classical statistics stack
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Run causal state and independent trough audit regression tests
        working-directory: private
        run: |
          python -m unittest \
            validation.ml.test_unsupervised_turn_lead \
            validation.ml.test_unsupervised_window_comparison \
            validation.ml.test_unsupervised_regimes -v
      - name: Compare 120, 120 plus 300 down context, and 300 signal lead
        working-directory: private
        shell: bash
        env:
          YEARS: ${{ inputs.validation_years || '2022 2023 2024 2025' }}
        run: |
          set -euo pipefail
          read -ra selected_years <<< "$YEARS"
          if (( ${#selected_years[@]} == 0 )); then
            echo "::error::Select at least one historical year"
            exit 1
          fi
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.unsupervised_turn_lead_validation \
            --years "${selected_years[@]}"
      - name: Save only new 120 300 lead-lag research files privately
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_turn_lead/
          if git diff --cached --quiet; then
            echo 'TURN_LEAD_RESULT_NO_CHANGES'
          else
            git commit -m 'Save separate 120/300 trough-lead audit without changing regime models' >/dev/null
            git fetch origin main >/tmp/turn_lead_fetch.log 2>&1
            if ! git rebase origin/main >/tmp/turn_lead_rebase.log 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              echo '::error::TURN_LEAD_RESULT_REBASE_FAILED'
              exit 1
            fi
            if ! git push origin HEAD:main >/tmp/turn_lead_push.log 2>&1; then
              echo '::error::TURN_LEAD_RESULT_PUSH_FAILED'
              exit 1
            fi
            echo 'TURN_LEAD_RESULT_SAVED=true'
          fi

# The only written path is data/ml/unsupervised_turn_lead/ in the private repo.
# All prior V2/V3 and unsupervised models and KRX prices remain untouched.
