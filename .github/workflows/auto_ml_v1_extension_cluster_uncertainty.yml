name: ML V1 Extension - Frozen Symbol Cluster Uncertainty
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scikit-learn joblib
      - name: Synthetic cluster bootstrap and seal guards
        working-directory: private
        run: python -m unittest validation.ml.test_v1_extension_cluster_uncertainty -v
      - name: Frozen RF score parity and symbol cluster uncertainty
        working-directory: private
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from analysis.ml.v1_extension_cluster_uncertainty import run
          result=run()
          assert result["sealed_2023_read"] is False
          assert not any(result[k] for k in ("training_approved","point_in_time_verified","tradable_strategy_approved"))
          assert [result["per_year"][str(y)]["nonoverlap_n"] for y in (2019,2020,2021,2022)]==[226,224,226,221]
          Path("/tmp/v1_cluster_uncertainty.json").write_text(json.dumps(result,indent=2)+"\\n")
          print("V1_CLUSTER_GATES_PASS=true")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-cluster-uncertainty
          path: /tmp/v1_cluster_uncertainty.json
          retention-days: 14
          if-no-files-found: error
