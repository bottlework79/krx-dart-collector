name: Verify Private DART Financial Calculations

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '검증할 종목코드 6자리'
        required: true
        type: string
        default: '005930'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source and DB
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline smoke tests
        working-directory: private
        run: python -m unittest discover -s validation/financials -p "test_*.py" -v
      - name: Inspect original DART filing candidates
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          python - <<'PY'
          import os, re, json, urllib.request, urllib.parse
          from analysis.financials.db_adapter import load_database
          from analysis.financials.dart_original_extractor import extract_candidates
          code = os.environ['STOCK_CODE']
          records = [v for v in load_database().values()
                     if str(v.get('ticker','')).zfill(6)==code and v.get('fs_div')=='CFS']
          records.sort(key=lambda v:(int(v['year']), {'q1':1,'half':2,'q3':3,'annual':4}[v['report']]))
          latest = records[-1]
          periods = [(int(latest['year']),latest['report'])]
          if latest['report']!='annual':
              periods += [(int(latest['year'])-1,'annual'),(int(latest['year'])-1,latest['report'])]
          for year,report in periods:
              matches = [v for v in records if int(v['year'])==year and v['report']==report]
              if len(matches)!=1:
                  print('ORIGINAL_DA',year,report,'missing_or_ambiguous_filing')
                  continue
              v=matches[0]
              receipts={str(x) for x in [v.get('rcept_no'),v.get('receipt_no')]
                        +[r.get('rcept_no') for r in v.get('rows',[])[:3]]
                        if re.fullmatch(r'[0-9]{14}',str(x or ''))}
              if len(receipts)!=1:
                  print('ORIGINAL_DA',year,report,'missing_or_ambiguous_receipt')
                  continue
              params=urllib.parse.urlencode({'crtfc_key':os.environ['DART_API_KEY'],'rcept_no':next(iter(receipts))})
              import time
              from urllib.error import URLError, HTTPError
              body = None
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(
                          'https://opendart.fss.or.kr/api/document.xml?'+params,
                          timeout=45
                      ) as response:
                          body=response.read(32*1024*1024+1)
                      break
                  except (URLError, TimeoutError, HTTPError) as exc:
                      print('ORIGINAL_DA_DOWNLOAD_RETRY', json.dumps({
                          'year':year,'report':report,'attempt':attempt,
                          'error_type':type(exc).__name__
                      }))
                      if attempt < 3:
                          time.sleep(attempt * 2)
              if body is None:
                  print('ORIGINAL_DA_DOWNLOAD_UNAVAILABLE',json.dumps({
                      'year':year,'report':report,'status':'network_failure_not_zero'
                  }))
                  continue
              candidates=extract_candidates(body)
              matched=[c for c in candidates if c.get('arithmetic_reconciled')]
              from collections import Counter
              print('ORIGINAL_DA_SECTIONS',json.dumps({
                  'year':year,'report':report,
                  'sections':dict(Counter(
                      c['kind'] + ':' + c.get('source_section_hint','unknown')
                      for c in candidates if c['kind'] in
                      ('depreciation','amortization','combined_da',
                       'cashflow_depreciation','cashflow_amortization')
                  ).most_common())
              },ensure_ascii=False))
              from analysis.financials.dart_original_extractor import original_zip_texts
              document_sections = []
              for source_name, raw_text in original_zip_texts(body):
                  document_sections.append({
                      'file':source_name,
                      'has_consolidated_notes':bool(re.search(r'연결재무제표.{0,40}주석|연결재무제표에\\s*대한\\s*주석',raw_text)),
                      'cashflow_note_mentions':len(re.findall(r'현금흐름표',raw_text)),
                      'intangible_note_mentions':len(re.findall(r'무형자산',raw_text))
                  })
              print('ORIGINAL_DA_DOCUMENT_SECTIONS',json.dumps({
                  'year':year,'report':report,'files':document_sections[:12]
              },ensure_ascii=False))
              print('ORIGINAL_DA_DIAGNOSTIC',json.dumps({
                  'year':year,'report':report,
                  'candidate_kinds':dict(Counter(c['kind'] for c in candidates)),
                  'combined_samples':[{'value':c['value_as_printed'],
                     'column':c['column_index'],'unit':c['unit_hint'],
                     'scope':c['scope_hint'],'file':c['source_file']}
                     for c in candidates if c['kind']=='combined_da'][:8]
              },ensure_ascii=False))
              # Bounded, redacted structural evidence for D&A candidates.
              # Never log the original ZIP or credentials.
              from analysis.financials.dart_original_extractor import original_zip_texts, TableParser
              da_kinds = {'depreciation','amortization','combined_da',
                          'cashflow_depreciation','cashflow_amortization'}
              evidence = []
              parsed = {}
              for filename, raw in original_zip_texts(body):
                  parser = TableParser()
                  parser.feed(raw)
                  parsed[filename] = parser.tables
              for c in candidates:
                  if c['kind'] not in da_kinds or len(evidence) >= 18:
                      continue
                  table = parsed[c['source_file']][c['table_index']]
                  ri = c['row_index']
                  rows = table['rows']
                  def preview(row):
                      return [re.sub(r'\\s+',' ',cell['text'])[:75] for cell in row[:10]]
                  evidence.append({
                      'kind':c['kind'],'file':c['source_file'],
                      'table':c['table_index'],'row':ri,'column':c['column_index'],
                      'amount':c['value_as_printed'],'unit':c['unit_hint'],
                      'scope':c['scope_hint'],'context':re.sub(r'\\s+',' ',table['context'])[-150:],
                      'previous':preview(rows[ri-1]) if ri else [],
                      'current':preview(rows[ri]),
                      'next':preview(rows[ri+1]) if ri+1<len(rows) else []})
              print('ORIGINAL_DA_EVIDENCE',json.dumps({
                  'year':year,'report':report,'samples':evidence
              },ensure_ascii=False))
              print('ORIGINAL_DA',json.dumps({'year':year,'report':report,'candidate_count':len(matched),
                  'sample':[{'amount':c['value_as_printed'],'unit_hint':c['unit_hint'],
                             'scope_hint':c['scope_hint'],'file':c['source_file']}
                            for c in matched[:5]],'approved':False},ensure_ascii=False))
          PY
      - name: Install pandas for price DB inspection
        run: python -m pip install pandas
      - name: Verify financial database and calculations
        working-directory: private
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          from analysis.financials.db_adapter import load_database, compute_owner_ttm, latest_annual_payloads, annual_ratios
          from analysis.financials.parent_profit_view import build_view
          code = os.environ['STOCK_CODE'].strip()
          if len(code) != 6 or not code.isdigit():
              raise SystemExit('Invalid stock code: require six digits')
          full_db = load_database()
          db = {k:v for k,v in full_db.items() if str(v.get('ticker','')).zfill(6) == code}
          if not db:
              raise SystemExit(f'No DART data for stock {code}; collect it first')
          print('Selected ticker:', code)
          print("DB records:", len(db))
          print("Tickers:", len({str(v['ticker']).zfill(6) for v in db.values()}))
          print("Years:", dict(sorted(Counter(str(v['year']) for v in db.values()).items())))
          print("Reports:", dict(Counter(v['report'] for v in db.values())))
          print("Scopes:", dict(Counter(v['fs_div'] for v in db.values())))
          annual = build_view(db)
          print("Annual parent statuses:", dict(Counter(v['status'] for v in annual)))
          ttm = compute_owner_ttm(db)
          print("TTM periods:", len(ttm))
          print("TTM statuses:", dict(Counter(v['status'] for v in ttm)))
          latest = latest_annual_payloads(db)
          results = []
          for payload in latest.values():
              prior = next((v for v in db.values() if v.get('ticker') == payload.get('ticker')
                            and v.get('report') == 'annual'
                            and int(v.get('year')) == int(payload.get('year')) - 1
                            and v.get('fs_div') == payload.get('fs_div')), None)
              results.append(annual_ratios(payload, prior_annual=prior))
              print('Prior annual matched:', prior is not None)
              from analysis.financials.db_adapter import unique_amount
              print('Income fields present:', {k: unique_amount(payload, k) is not None for k in ('parent_net_income', 'net_income')})
          print("Annual ratio eligible tickers:", len(results))
          for key in ("ROE", "ROA", "debt_ratio", "current_ratio"):
              print(key, "available:", sum(v[key] is not None for v in results))
          print("PBR withheld without dated market cap:", all(v["PBR"] is None for v in results))
          import pandas as pd
          from pathlib import Path
          price_path = Path('data/market_1250.pkl.gz')
          if price_path.exists():
              prices = pd.read_pickle(price_path, compression='gzip')
              print('Price DB columns:', list(prices.columns))
              if 'Code' in prices.columns:
                  matched = prices[prices['Code'].astype(str).str.zfill(6) == code]
                  print('Selected ticker price rows:', len(matched))
                  if not matched.empty and {'Date','Close'}.issubset(matched.columns):
                      last = matched.sort_values('Date').iloc[-1]
                      print('Latest close:', str(last['Date']), str(last['Close']))
                  print('Explicit market cap column present:', any(x in prices.columns for x in ('MarketCap','Marcap','market_cap_krw')))
                  if 'MarketCap' in matched.columns and not matched.empty:
                      from analysis.financials.ev_ebitda_ttm import ev_ebitda_ttm
                      cap_rows = matched.dropna(subset=['MarketCap']).sort_values('Date')
                      if cap_rows.empty:
                          print('EV/EBITDA: unavailable; no verified KRX market cap')
                      else:
                          cap_row = cap_rows.iloc[-1]
                          cap = int(cap_row['MarketCap'])
                          print('KRX market cap:', cap, 'as of', str(cap_row['Date']))
                          if cap <= 0:
                              raise SystemExit('Invalid KRX market cap')
                          print('EV/EBITDA: pending verified DART debt, leases, NCI, cash, eligible short-term financial assets, operating income TTM and D&A TTM; no estimated ratio emitted')
                  else:
                      print('EV/EBITDA: unavailable; MarketCap missing from price DB')
          else:
              print('Price DB not found')
          from analysis.financials.account_values import parent_equity
          from analysis.financials.ratios import pbr
          from analysis.financials.current_per import latest_verified_snapshot, attach_current_market_caps
          if price_path.exists() and 'Code' in prices.columns and 'MarketCap' in matched.columns:
              cap_rows = matched.dropna(subset=['Date', 'MarketCap']).sort_values('Date')
              if not cap_rows.empty:
                  cap_row = cap_rows.iloc[-1]
                  cap = int(cap_row['MarketCap'])
                  asof = pd.Timestamp(cap_row['Date']).date()
                  latest_balance = max(db.values(), key=lambda v: (int(v['year']), {'q1':1,'half':2,'q3':3,'annual':4}[v['report']]))
                  equity = parent_equity(latest_balance)
                  print('LATEST BALANCE:', latest_balance['year'], latest_balance['report'], 'parent equity:', equity)
                  print('LATEST PBR:', str(pbr(cap, equity)) if equity is not None else 'unavailable')
                  snapshot = latest_verified_snapshot(ttm, asof=asof)
                  quotes = [{'ticker':code,'market_cap_krw':cap,'market_cap_date':asof.isoformat(),'source':'KRX_DATE_MARKET_CAP'}]
                  current = attach_current_market_caps(snapshot, quotes, asof=asof)
                  print('LATEST PER TTM:', next((r for r in current if str(r['ticker']).zfill(6)==code), 'unavailable'))
          print('PBR/PER require verified dated KRX market cap; Close alone is insufficient')
          # EV/EBITDA input audit: print actual DART statement rows, not inferred values.
          from analysis.financials.db_adapter import unique_amount
          from analysis.financials.ev_ebitda_ttm import latest_report_ttm
          periods = sorted(db.values(), key=lambda v:(int(v['year']),{'q1':1,'half':2,'q3':3,'annual':4}[v['report']]))
          current = periods[-1]
          print('EV AUDIT latest period:', current['year'], current['report'], current['fs_div'])
          for metric in ('operating_profit','cash','finance_costs','operating_cashflow','capex_ppe'):
              print('EV AUDIT', metric, unique_amount(current,metric))
          terms = ('차입금','사채','리스부채','비지배지분','단기금융','감가상각','무형자산상각','상각비','현금및현금성자산')
          for payload in [v for v in periods if (int(v['year']),v['report']) in
                          {(int(current['year']),current['report']),
                           (int(current['year'])-1,'annual'),
                           (int(current['year'])-1,current['report'])}]:
              print('EV AUDIT source:', payload['year'],payload['report'],payload['fs_div'])
              hits = [r for r in payload['rows'] if r.get('sj_div') in ('BS','CF','IS','CIS')
                      and any(t in str(r.get('account_nm','')) for t in terms)
                      and str(r.get('account_detail') or '-').strip() in ('','-')]
              for r in hits[:65]:
                  print('EV AUDIT account:', r.get('sj_div'),r.get('account_id'),
                        r.get('account_nm'),r.get('thstrm_amount'))
              print('EV AUDIT matched account count:',len(hits))
          from analysis.financials.ev_ebitda_ttm import audited_ev_inputs_from_database
          ev_audit = audited_ev_inputs_from_database(db, code, locals().get('cap'))
          print('EV INPUTS CONNECTED:', {k: ({a: str(b) if b is not None else None for a,b in v.items()} if k == 'inputs' else v) for k,v in ev_audit.items()})
          print('EV AUDIT calculation withheld until all debt, leases, NCI, cash and D&A are verified without double counting')
          for row in sorted(results, key=lambda x: x["ticker"])[:5]:
              print("SAMPLE:", {k: str(v) if v is not None else None for k,v in row.items()})
          PY
