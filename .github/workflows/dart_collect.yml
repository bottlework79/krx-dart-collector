name: DART Financial Statement Collection

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 6자리 (공란이면 전체 대상에서 미완료 순서대로)'
        required: false
        type: string
        default: ''
      year:
        description: '사업연도 (필수)'
        required: true
        type: number
        default: 2026
      report:
        description: '보고서 (필수, 해당 연도·보고서 한 기간)'
        required: true
        type: choice
        options:
          - q1
          - half
          - q3
          - annual
        default: half
      max_stocks:
        description: '이번 실행 최대 종목 수 (1~25, 공란이면 자동 전체 진행)'
        required: false
        type: string
        default: ''
      force_refresh:
        description: '재수집 (체크 시 기존 성공 이력과 관계없이 새로 조회)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Keep sequential writes against the private financial database.
concurrency:
  group: dart-private-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Offline Stage 1 period-history regression tests
        working-directory: private
        run: python -m unittest validation.financials.test_smoke.StageOnePeriodResumeTests
      - name: Choose next stocks using saved per-period history
        id: plan
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
          YEAR: ${{ inputs.year }}
          REPORT: ${{ inputs.report }}
          MAX_STOCKS: ${{ inputs.max_stocks }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          set -euo pipefail
          args=(--stage1-period-plan --year "$YEAR" --report "$REPORT" \
                --output-file "$RUNNER_TEMP/stage1_period_plan.json")
          if [[ -n "$STOCK_CODE" ]]; then args+=(--code "$STOCK_CODE"); fi
          if [[ -n "$MAX_STOCKS" ]]; then args+=(--max-stocks "$MAX_STOCKS"); fi
          if [[ "$FORCE_REFRESH" == "true" ]]; then args+=(--force-refresh); fi
          python -m analysis.financials.processing_history "${args[@]}"
          python - "$RUNNER_TEMP/stage1_period_plan.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write(f"has_work={str(plan['has_work']).lower()}\n")
              out.write(f"codes_csv={','.join(plan['selected'])}\n")
              out.write(f"selected_count={len(plan['selected'])}\n")
          PY
      - name: Collect selected stocks for this exact reporting period
        id: collect
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        continue-on-error: true
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          YEAR: ${{ inputs.year }}
          REPORT: ${{ inputs.report }}
          CODES_CSV: ${{ steps.plan.outputs.codes_csv }}
        run: |
          set -euo pipefail
          # Collector refreshes every selected report, even if an old DB row exists.
          python -m collectors.dart.collect_dart \
            --batch-codes "$CODES_CSV" --batch-size 25 \
            --start-year "$YEAR" --end-year "$YEAR" \
            --end-report "$REPORT" --only-report "$REPORT" \
            --result-file "$RUNNER_TEMP/stage1_period_results.json"
      - name: Commit DB and append stock-level collection history
        if: ${{ always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        working-directory: private
        env:
          YEAR: ${{ inputs.year }}
          REPORT: ${{ inputs.report }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/financial_statements/ data/unavailable_periods.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DART source data for $YEAR $REPORT (run $GITHUB_RUN_ID)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "STAGE1_PERIOD_DB_PUSHED year=$YEAR report=$REPORT"
          fi
          if [[ -f "$RUNNER_TEMP/stage1_period_results.json" ]]; then
            python -m analysis.financials.processing_history \
              --stage1-period-record --year "$YEAR" --report "$REPORT" \
              --result-file "$RUNNER_TEMP/stage1_period_results.json" \
              --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            git add -- data/processing_history/runs.jsonl
            if ! git diff --cached --quiet; then
              git commit -m "Record DART stock/year/report outcomes (run $GITHUB_RUN_ID)"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          else
            echo "::error::No collector result file; no stock may be marked complete"
            exit 1
          fi
          if [[ "$COLLECT_OUTCOME" != "success" ]]; then
            echo "::error::Collection had failed stocks; saved successful results and recorded failures"
            exit 1
          fi
      - name: Continue all-stock run only when no manual limit was provided
        if: ${{ success() && steps.plan.outputs.has_work == 'true' && inputs.stock_code == '' && inputs.max_stocks == '' && !inputs.force_refresh }}
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ inputs.year }}
          REPORT: ${{ inputs.report }}
        run: |
          set -euo pipefail
          python -m analysis.financials.processing_history \
            --stage1-period-plan --year "$YEAR" --report "$REPORT" \
            --output-file "$RUNNER_TEMP/stage1_followup_plan.json"
          pending="$(python - "$RUNNER_TEMP/stage1_followup_plan.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["pending_count"])
          PY
          )"
          if [[ "$pending" == "0" ]]; then
            echo "STAGE1_PERIOD_ALL_STOCKS_FINISHED year=$YEAR report=$REPORT"
            exit 0
          fi
          gh workflow run dart_collect.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f stock_code= -f year="$YEAR" -f report="$REPORT" \
            -f max_stocks= -f force_refresh=false
          echo "STAGE1_PERIOD_NEXT_DISPATCHED year=$YEAR report=$REPORT remaining=$pending"
