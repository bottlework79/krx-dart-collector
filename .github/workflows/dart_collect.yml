name: DART Financial Statement Collection

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 6자리 (입력 시 해당 종목, 비우면 배치)'
        required: false
        type: string
        default: ''
      batch_index:
        description: '배치 번호 (0부터)'
        required: false
        type: number
        default: 0
      batch_size:
        description: '배치 종목 수 (1~25)'
        required: false
        type: number
        default: 2
      start_year:
        description: '수집 시작 연도'
        required: false
        type: number
        default: 2021

permissions:
  contents: read

concurrency:
  group: dart-private-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Collect DART statements
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          START_YEAR: ${{ inputs.start_year }}
        run: |
          set -euo pipefail
          args=(--start-year "$START_YEAR" --batch-size "$BATCH_SIZE" --batch-index "$BATCH_INDEX")
          if [[ -n "$STOCK_CODE" ]]; then
            args=(--start-year "$START_YEAR" --batch-size 1 --batch-index 0 --code "$STOCK_CODE")
          fi
          python -m collectors.dart.collect_dart "${args[@]}"
      - name: Commit private DART database
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/financial_statements.pkl.gz data/unavailable_periods.json
          if git diff --cached --quiet; then
            echo "재무 DB 변경 없음"
          else
            git commit -m "Update private DART statements"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "재무 DB 저장 완료"
          fi
