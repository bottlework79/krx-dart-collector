name: DART Financial Statement Collection

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 6자리 (입력 시 해당 종목, 비우면 배치)'
        required: false
        type: string
        default: ''
      batch_index:
        description: '배치 번호 (0부터)'
        required: false
        type: number
        default: 0
      batch_size:
        description: '배치 종목 수 (1~25)'
        required: false
        type: number
        default: 2
      start_year:
        description: '수집 시작 연도 (2015년은 TTM 계산용 보조자료)'
        required: false
        type: number
        default: 2015
      end_report:
        description: '종료 연도 마지막 보고서 (q1, half, q3, annual)'
        required: false
        type: choice
        options:
          - half
          - annual
          - q1
          - q3
        default: half
      end_year:
        description: '수집 종료 연도 (기본 2026년, 미공시 분기는 자동 제외)'
        required: false
        type: number
        default: 2026

permissions:
  contents: read

concurrency:
  group: dart-private-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Collect DART statements
        working-directory: private
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODE: ${{ inputs.stock_code }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          END_REPORT: ${{ inputs.end_report }}
        run: |
          set -euo pipefail
          args=(--start-year "$START_YEAR" --end-year "$END_YEAR" --end-report "$END_REPORT" --batch-size "$BATCH_SIZE" --batch-index "$BATCH_INDEX")
          if [[ -n "$STOCK_CODE" ]]; then
            args=(--start-year "$START_YEAR" --end-year "$END_YEAR" --end-report "$END_REPORT" --batch-size 1 --batch-index 0 --code "$STOCK_CODE")
          fi
          python -m collectors.dart.collect_dart "${args[@]}"
      - name: Commit private DART database
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--record-stage stage1 --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [[ -n "${{ inputs.stock_code }}" ]]; then args+=(--code "${{ inputs.stock_code }}"); fi
          python -m analysis.financials.processing_history "${args[@]}"
          git add -- data/financial_statements/ data/unavailable_periods.json data/processing_history/
          if git diff --cached --quiet; then
            echo "재무 DB 변경 없음"
          else
            git commit -m "Update private DART statements"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "재무 DB 저장 완료"
          fi
