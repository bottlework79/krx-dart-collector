name: Calculate Financial Indicators (Offline)

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 6자리 (비우면 전체)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: private-financial-calculation
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install pandas
      - name: Calculate financial indicators from saved DB only
        working-directory: private
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          set -euo pipefail
          if [[ -n "$STOCK_CODE" ]]; then
            python -m analysis.financials.calculate --code "$STOCK_CODE"
          else
            python -m analysis.financials.calculate
          fi
      - name: Commit private calculation results
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/financial_indicators.json
          if git diff --cached --quiet; then
            echo "계산 결과 변경 없음"
          else
            git commit -m "Update calculated financial indicators"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
