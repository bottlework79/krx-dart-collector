name: Calculate Financial Indicators

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '종목코드 6자리 (비우면 전체)'
        required: false
        default: ''
        type: string

      year:
        description: '계산 기준연도 (비우면 전체 연도)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: private-financial-calculation
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calculation dependencies
        run: python -m pip install pandas lxml html5lib beautifulsoup4
      - name: Calculate financial indicators from verified Stage 2 inputs
        working-directory: private
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$STOCK_CODE" ]]; then args+=(--code "$STOCK_CODE"); fi
          if [[ -n "$YEAR" ]]; then args+=(--year "$YEAR"); fi
          python -m analysis.financials.calculate --processed-inputs data/financial_inputs "${args[@]}"
      - name: Compare flagged anomalies with Naver Finance reference
        if: ${{ inputs.stock_code != '' && inputs.year != '' }}
        working-directory: private
        continue-on-error: true
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          YEAR: ${{ inputs.year }}
        run: |
          python -m analysis.financials.naver_compare --code "$STOCK_CODE" --year "$YEAR"
      - name: Plan remaining missing evidence
        working-directory: private
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$STOCK_CODE" ]]; then args+=(--code "$STOCK_CODE"); fi
          python -m analysis.financials.missing_data "${args[@]}"
      - name: Diagnose original D&A and borrowing coverage
        if: ${{ inputs.stock_code != '' }}
        working-directory: private
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: python -m analysis.financials.evidence_diagnostics --code "$STOCK_CODE"
      - name: Commit private calculation results
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/financial_indicators/ data/missing_financial_data.json
          if [[ -d data/original_evidence ]]; then git add -- data/original_evidence; fi
          if [[ -f data/financial_evidence_diagnostics.json ]]; then git add -- data/financial_evidence_diagnostics.json; fi
          if git diff --cached --quiet; then
            echo "계산 결과 변경 없음"
          else
            git commit -m "Update calculated financial indicators"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
