name: Start DART Financial Inputs Stage 2 - Initial Batch

on:
  push:
    paths:
      - .github/workflows/dart_stage2_bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dart-stage2-bootstrap
  cancel-in-progress: false

jobs:
  dispatch-first-batch:
    # A tagged commit initializes Stage 2 exactly once. Manual workflow_dispatch
    # remains available as an explicit operator action.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[START_DART_STAGE2_2026]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch checkpointed Stage 2 (first two stocks, all fiscal years)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run financial_inputs.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f stock_code= -f batch_index=0 -f batch_size=2 \
            -f retry_incomplete_only=true \
            -f start_year=2015 -f end_year=2026
          echo "STAGE2_FIRST_BATCH_DISPATCHED batch_index=0 batch_size=2 years=2015..2026 retry_incomplete_only=true"
