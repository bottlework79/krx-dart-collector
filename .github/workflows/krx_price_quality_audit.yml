name: KRX ML - Price Quality Audit (Read Only)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: '주가 데이터 시작 연도 (기본 2015)'
        required: true
        type: number
        default: 2015
      end_year:
        description: '주가 데이터 마지막 연도 (기본 2026)'
        required: true
        type: number
        default: 2026

permissions:
  contents: read

concurrency:
  group: krx-ml-price-quality-audit-v1
  cancel-in-progress: false

jobs:
  price-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private KRX OHLCV and diagnostics
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only audit libraries
        run: python -m pip install pandas numpy
      - name: Run isolated audit tests
        working-directory: private
        run: python -m unittest validation.ml.test_price_quality_audit -v
      - name: Audit original annual OHLCV partitions without repair
        working-directory: private
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          python -m analysis.ml.price_quality_audit \
            --start-year "$START_YEAR" --end-year "$END_YEAR" \
            --output-dir data/ml/price_quality_audit_v1
      - name: Save only diagnostic results privately
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/price_quality_audit_v1/
          if git diff --cached --quiet; then
            echo PRICE_QUALITY_AUDIT_UNCHANGED=true
          else
            git commit -m 'Save private OHLCV quality diagnostics for ML' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::PRICE_QUALITY_PRIVATE_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo PRICE_QUALITY_AUDIT_SAVED=true
          fi
