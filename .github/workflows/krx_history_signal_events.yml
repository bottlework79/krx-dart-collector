name: KRX ML - First Versus Repeated Signals, 60 Stock Sessions

on:
  workflow_dispatch:
    inputs:
      force_recheck:
        description: '기존 반복신호 분석이 있어도 새로 실행'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/krx_history_signal_events.yml'

permissions:
  contents: read

concurrency:
  group: krx-historical-signal-event-audit
  cancel-in-progress: false

jobs:
  verify_events:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Checkout private KRX ML source and stock data
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical libraries
        run: |
          python -m pip install pandas numpy scikit-learn joblib requests finance-datareader
      - name: Verify repeated signal grouping, no leakage, matching cohorts, and prior ML
        working-directory: private
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m unittest \
            validation.ml.test_historical_signal_events \
            validation.ml.test_historical_peak_audit \
            validation.ml.test_historical_training_comparison \
            validation.ml.test_unsupervised_regimes -v
      - name: Verify historical data readiness and avoid redundant analysis
        id: ready
        working-directory: private
        env:
          FORCE: ${{ inputs.force_recheck }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from collectors.price.historical_backfill import read_manifest, status
          state=status(read_manifest(Path("data/historical_krx_2010_2014/manifest.json")),"data")
          out=Path("data/ml/unsupervised_historical_2010_vs_2015/signal_events_summary.json")
          run=state["complete"] and (not out.exists() or os.environ.get("FORCE")=="true")
          print("HISTORIC_SIGNAL_EVENT_READY=",{"complete":state["complete"],"run":run},flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY
      - name: Refit historical comparison and evaluate first events vs repeated alerts
        if: ${{ steps.ready.outputs.run == 'true' }}
        working-directory: private
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.historical_signal_events --max-fit-samples 100000
      - name: Save event-only results privately (do not overwrite models)
        if: ${{ success() && steps.ready.outputs.run == 'true' }}
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_historical_2010_vs_2015/signal_events_summary.json data/ml/unsupervised_historical_2010_vs_2015/signal_events_summary.csv data/ml/unsupervised_historical_2010_vs_2015/signal_events_diagnostics.csv
          if git diff --cached --quiet; then
            echo HISTORIC_SIGNAL_EVENTS_UNCHANGED=true
          else
            git commit -m 'Save ML first versus repeated 60-session signal events' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::HISTORIC_SIGNAL_EVENTS_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo HISTORIC_SIGNAL_EVENTS_SAVED=true
          fi
# Non-destructive analysis; old ML models and fixed-horizon reports are unchanged.
