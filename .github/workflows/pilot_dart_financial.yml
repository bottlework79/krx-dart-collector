name: Pilot DART Financial Collection
on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Zero-based DART company batch"
        required: true
        default: "0"
      batch_size:
        description: "Companies (1-5 during pilot)"
        required: true
        default: "2"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore temporary collection cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/financial_statements.pkl.gz
            data/unavailable_periods.json
          key: dart-pilot-krx-v1-${{ github.run_id }}
          restore-keys: |
            dart-pilot-krx-v1-
      - name: Restore private durable checkpoint if authorized
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DATA_TOKEN" ]; then
            python private_checkpoint.py download
          else
            echo "PRIVATE_CHECKPOINT=not_configured; temporary cache only"
          fi
      - name: Collect small pilot in public runner
        env:
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          if [ "$BATCH_SIZE" -lt 1 ] || [ "$BATCH_SIZE" -gt 5 ]; then
            echo "Pilot limited to 1-5 companies"; exit 1
          fi
          python collect_dart.py --batch-index "$BATCH_INDEX" --batch-size "$BATCH_SIZE" --workers 2
      - name: Validate KRX coverage and checksum
        if: success()
        run: python validate_collector_db.py
      - name: Build checksum manifest for handoff
        if: success()
        run: python build_manifest.py
      - name: Save validated private durable checkpoint if authorized
        if: success()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DATA_TOKEN" ]; then
            python private_checkpoint.py upload
          else
            echo "PRIVATE_CHECKPOINT=not_configured; permanent storage not enabled"
          fi
      - name: Save temporary collection cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/financial_statements.pkl.gz
            data/unavailable_periods.json
          key: dart-pilot-krx-v1-${{ github.run_id }}
      - name: Upload checksum manifest only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-financial-pilot-${{ github.run_id }}
          path: data/financial_manifest.json
          retention-days: 1
