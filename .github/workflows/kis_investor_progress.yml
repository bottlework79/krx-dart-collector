name: KIS Investor Flow - Progress Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private checkpoints
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy requests cryptography
      - name: Validate progress calculation
        working-directory: private
        run: python -m unittest validation.prices.test_kis_investor_history_status -v
      - name: Generate read-only annual status
        working-directory: private
        run: |
          python -m collectors.price.kis_investor_history_status --output /tmp/kis_investor_progress.json
          cat /tmp/kis_investor_progress.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload progress JSON
        uses: actions/upload-artifact@v4
        with:
          name: kis-investor-progress
          path: /tmp/kis_investor_progress.json
          retention-days: 7
