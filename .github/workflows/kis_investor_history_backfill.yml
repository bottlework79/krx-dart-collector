name: KIS Investor Flow - Continuous Historical Backfill (Private)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, batch, plan, quality, pilot]
        default: auto
        description: "auto=oldest pending 2010..2026; on success dispatch next batch"
        required: true
      year:
        type: number
        default: 2010
        required: true
      max_codes:
        type: number
        default: 100
        required: true
        description: "1..100 historical KRX stock-years per batch"
      codes:
        type: string
        default: ''
        required: false
        description: "Optional comma-separated six-digit KRX codes for batch"
  # Recovery check: resumes work if an earlier chain stopped or retries cooled down.
  # Immediate workflow_dispatch remains the primary, fast chaining mechanism.
  schedule:
    - cron: '30 0 * * *'  # Daily 09:30 KST, UTC+09
permissions:
  contents: read
  actions: write

# Shared with existing KIS OHLCV/token operations: no concurrent OAuth writers.
concurrency:
  group: kis-auth-single-writer
  cancel-in-progress: false

jobs:
  investor-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private KRX as-of universe and secured token checkpoint
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline KIS data dependencies
        run: python -m pip install pandas numpy requests cryptography
      - name: Historical KIS investor backfill safety and resume regressions
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest \
            validation.prices.test_kis_investor_history_backfill \
            validation.prices.test_kis_investor_history_chain \
            validation.ml.test_kis_investor_history_probe -v
      - name: Execute read-only investor history backfill or quality
        id: collect
        working-directory: private
        env:
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          MAX_CODES: ${{ inputs.max_codes }}
          CODES: ${{ inputs.codes }}
          BOOTSTRAP_MESSAGE: ${{ github.event.head_commit.message }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$BOOTSTRAP_MESSAGE" != "RUN_KIS_INVESTOR_HISTORY_CONTINUOUS_20261120" ]; then
              echo "::error::Unknown investor history bootstrap trigger"
              exit 1
            fi
            mode=auto
            year=2010
            count=100
            codes=""
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            mode=auto
            year=2010
            count=100
            codes=""
          else
            mode="${MODE:-auto}"
            year="${YEAR:-2010}"
            count="${MAX_CODES:-100}"
            codes="${CODES:-}"
          fi
          if ! [[ "$year" =~ ^20[0-9]{2}$ ]] || (( year < 2010 || year > 2026 )); then
            echo "::error::KIS investor history year must be 2010..2026"
            exit 1
          fi
          if ! [[ "$count" =~ ^[0-9]+$ ]] || (( count<1 || count>100 )); then
            echo "::error::KIS investor history batch count must be 1..100"
            exit 1
          fi
          if [ -n "$codes" ] && ! [[ "$codes" =~ ^[0-9]{6}(,[0-9]{6})*$ ]]; then
            echo "::error::KIS investor codes must be comma-separated 6 digit codes"
            exit 1
          fi
          if [ "$mode" = auto ] && [ -n "$codes" ]; then
            echo "::error::Auto always follows KRX historical manifest; codes must be blank"
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "KIS_INVESTOR_HISTORY_MODE=$mode year=$year batch_limit=$count"
          if [ "$mode" = pilot ]; then
            python -m collectors.price.kis_investor_history_backfill \
              --mode batch --year 2010 --max-codes 2 \
              --codes 000020,005930 --sleep-seconds 1.0
          elif [ "$mode" = auto ]; then
            python -m collectors.price.kis_investor_history_backfill \
              --mode auto --max-codes "$count" --sleep-seconds 1.0
          elif [ "$mode" = batch ]; then
            if [ -n "$codes" ]; then
              python -m collectors.price.kis_investor_history_backfill \
                --mode batch --year "$year" --max-codes "$count" \
                --codes "$codes" --sleep-seconds 1.0
            else
              python -m collectors.price.kis_investor_history_backfill \
                --mode batch --year "$year" --max-codes "$count" \
                --sleep-seconds 1.0
            fi
          elif [ "$mode" = plan ]; then
            python -m collectors.price.kis_investor_history_backfill --mode plan
          elif [ "$mode" = quality ]; then
            python -m collectors.price.kis_investor_history_backfill \
              --mode quality --year "$year"
          else
            echo "::error::Unsupported investor historical backfill mode"
            exit 1
          fi
      - name: Save private per-stock checkpoints even after collector failure
        id: persist
        if: always() && steps.checkout.outcome == 'success'
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/kis_investor_history ]; then
            git add -A -- data/kis_investor_history/
          fi
          if [ -f data/adjusted_kis/auth/token.enc.json ]; then
            git add -- data/adjusted_kis/auth/token.enc.json
          fi
          if git diff --cached --quiet; then
            echo "INVESTOR_HISTORY_CHECKPOINT_UNCHANGED=true"
          else
            git commit -m 'Save private KIS investor history shard, manifest and quality' >/dev/null
            git fetch origin main >/dev/null
            if ! git rebase origin/main >/dev/null; then
              git rebase --abort || true
              echo "::error::INVESTOR_HISTORY_PRIVATE_REBASE_FAILED"
              exit 1
            fi
            if ! git push origin HEAD:main >/dev/null; then
              echo "::error::INVESTOR_HISTORY_PRIVATE_PUSH_FAILED"
              exit 1
            fi
            echo "INVESTOR_HISTORY_PRIVATE_CHECKPOINT_SAVED=true"
          fi
      - name: Verify private same-run checkpoint and decide next eligible KRX year
        id: next
        if: success() && steps.collect.outputs.mode == 'auto' && github.run_attempt == 1
        working-directory: private
        run: |
          set -euo pipefail
          python -m collectors.price.kis_investor_history_chain
      - name: Dispatch next 2010-to-current investor batch immediately
        if: success() && github.run_attempt == 1 && steps.next.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Trigger only after successful current KIS call, quality QA, and
          # successful PRIVATE shard/manifest commit. No fixed 4/20-run cap:
          # keep progressing until no eligible code-years remain.
          gh workflow run kis_investor_history_backfill.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f mode=auto -f year=2010 -f max_codes=100
          echo INVESTOR_HISTORY_NEXT_RUN_REQUESTED=true

# Fail closed: token/API errors, non-progress, bad quality, failed PRIVATE push,
# missing historical KRX source, or failed dispatch halt the immediate chain.
# Daily schedule is a recovery check for eligible work after error/cooldown.
# No KIS balance/order endpoints; no ML training approval.
