name: KIS주가 ChatGPT 직접 연구 데이터 준비

# Temporarily paused for ML source cleanup (2026-11-28).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kis-chatgpt-research-bridge-single-writer
  cancel-in-progress: false

jobs:
  prepare-private-kis-research-samples:
    if: ${{ false }} # Pause until cleanup is verified
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PRIVATE KIS prices and ML sources
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline scientific research dependencies
        run: python -m pip install pandas numpy scikit-learn joblib requests cryptography
      - name: Regression-test KIS bridge and KIS-only loader
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest \
            validation.ml.test_kis_chatgpt_research_bridge \
            validation.ml.test_unified_kis_key_audit \
            validation.ml.test_unified_kis_training -v
      - name: Generate bounded KIS-only ChatGPT-readable research JSON before next hour
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.kis_chatgpt_research_bridge \
            --max-codes 80 --max-rows-per-year 5000 --pilot-rows-per-year 24 --chunk-rows 180
      - name: Build compressed text dataset for direct GPT Python transport
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.kis_chatgpt_payload
          test -s data/ml/kis_chatgpt_bridge_v1/direct_python_q8.json
          test -s data/ml/kis_chatgpt_bridge_v1/direct_python_q8_gzip.json
          test -s data/ml/kis_chatgpt_bridge_v1/direct_float16_manifest.json
      - name: Run one NEW pre-registered KIS research hypothesis (GitHub fallback)
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest validation.ml.test_gpt_python_novelty_research -v
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          root = Path('data/ml/kis_chatgpt_bridge_v1')
          q = json.loads((root / 'novelty/queue.json').read_text(encoding='utf-8'))
          source = json.loads((root / 'direct_python_payload.json').read_text(encoding='utf-8'))
          if q['source'] != source['source'] or source['sealed_2023_read'] is not False:
              raise RuntimeError('KIS-only research provenance mismatch')
          digest = source['transport_sha256'][:16]
          folder = root / 'novelty' / 'github'
          folder.mkdir(parents=True, exist_ok=True)
          for hypothesis in q['hypotheses']:
              outfile = folder / f'{digest}_{hypothesis}.json'
              if outfile.exists():
                  continue
              subprocess.run([
                  sys.executable, '-m', 'analysis.ml.gpt_python_novelty_research',
                  '--data', str(root / 'direct_python_payload.json'),
                  '--hypothesis', hypothesis,
                  '--environment', 'github_actions_python',
                  '--output', str(outfile),
              ], check=True)
              output = json.loads(outfile.read_text(encoding='utf-8'))
              assert output['hypothesis_id'] == hypothesis
              assert output['sample_count'] == source['rows']
              assert output['independent_improvement_verified'] is False
              assert output['model_auto_promotion_allowed'] is False
              print('KIS_NOVEL_RESEARCH_NEW=' + json.dumps({
                  'hypothesis': hypothesis,
                  'paired_ap_delta': output['paired_difference']['mean_ap_lift'],
                  'ap_win_years': output['candidate_better_ap_in_folds'],
                  'environment': 'github_actions_python',
                  'source_digest': digest,
              }), flush=True)
              break
          else:
              print('KIS_NOVEL_RESEARCH_QUEUE_EXHAUSTED=' + json.dumps({
                  'hypotheses': len(q['hypotheses']), 'source_digest': digest,
                  'independent_improvement_verified': False
              }), flush=True)
          PY
      - name: Persist PRIVATE research bridge artifacts without raw OHLCV export
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/kis_chatgpt_bridge_v1/
          if git diff --cached --quiet; then
            echo KIS_CHATGPT_BRIDGE_UNCHANGED=true
          else
            git commit -m 'Prepare KIS research-only JSON samples for direct ChatGPT experiments' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::KIS_CHATGPT_BRIDGE_PRIVATE_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo KIS_CHATGPT_BRIDGE_PRIVATE_SAVED=true
          fi

# KIS prices only; KRX is exact key reference; 2023 sealed; no trading.
