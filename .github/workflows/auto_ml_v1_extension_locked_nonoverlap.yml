name: ML V1 Extension - Frozen RF Nonoverlap Evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-v1-extension-nonoverlap
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scikit-learn joblib
      - name: Synthetic frozen nonoverlap regression guards
        working-directory: private
        run: python -m unittest validation.ml.test_v1_extension_locked_nonoverlap -v
      - name: Read-only locked refit and frozen metrics parity
        working-directory: private
        run: |
          python -m analysis.ml.v1_extension_locked_nonoverlap > /tmp/v1_nonoverlap_log.txt
          python - <<'PY'
          import json
          s=open('/tmp/v1_nonoverlap_log.txt').read()
          assert s.startswith('V1_LOCKED_NONOVERLAP=')
          r=json.loads(s.split('=',1)[1])
          assert r['source_years_read']==list(range(2015,2023))
          assert r['sealed_2023_read'] is False
          assert not any(r[k] for k in ('training_approved','point_in_time_verified','tradable_strategy_approved'))
          assert [r['per_year'][str(y)]['original']['n'] for y in (2019,2020,2021,2022)]==[679,675,747,665]
          print('V1_NONOVERLAP_GATES_PASS=true')
          for y in (2019,2020,2021,2022):
              d=r['per_year'][str(y)]
              print('V1_NONOVERLAP_YEAR='+json.dumps({'year':y,'nonoverlap':d['nonoverlap'],'nonoverlap_dummy':d['nonoverlap_dummy'],'original':d['original']}))
          PY
      - name: Publish aggregate audit report only
        uses: actions/upload-artifact@v4
        with:
          name: v1-locked-nonoverlap-aggregate
          path: /tmp/v1_nonoverlap_log.txt
          retention-days: 14
          if-no-files-found: error
