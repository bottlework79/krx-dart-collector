name: KRX ML - Matched First Event and Causal Trend Phase Audit

on:
  workflow_dispatch:
    inputs:
      force_recheck:
        description: '기존 최초 이벤트 분석 결과도 다시 검증'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/krx_history_event_priority.yml'

permissions:
  contents: read

concurrency:
  group: krx-ml-matched-first-events
  cancel-in-progress: false

jobs:
  matched_events:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Checkout private KRX prices and model code
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: true
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model and price dependencies
        run: |
          python -m pip install pandas numpy scikit-learn joblib requests finance-datareader
      - name: Test trend context, matched unique event count, future-only outcomes and existing regressions
        working-directory: private
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m unittest \
            validation.ml.test_historical_event_priority \
            validation.ml.test_historical_signal_events \
            validation.ml.test_historical_peak_audit \
            validation.ml.test_historical_training_comparison \
            validation.ml.test_unsupervised_regimes -v
      - name: Confirm historical prices complete and first-event result new
        id: readiness
        working-directory: private
        env:
          FORCE: ${{ inputs.force_recheck }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from collectors.price.historical_backfill import read_manifest, status
          state=status(read_manifest(Path("data/historical_krx_2010_2014/manifest.json")),"data")
          out=Path("data/ml/unsupervised_historical_2010_vs_2015/matched_first_event_summary.json")
          run=state["complete"] and (not out.exists() or os.getenv("FORCE")=="true")
          print("MATCHED_FIRST_EVENT_READY",{"complete":state["complete"],"run":run},flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY
      - name: Compare equal unique events at 0.5 1 2 pct and classify causal trends
        if: ${{ steps.readiness.outputs.run == 'true' }}
        working-directory: private
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
          python -m analysis.ml.historical_event_priority --max-fit-samples 100000
      - name: Commit only new matched event reports privately
        if: ${{ success() && steps.readiness.outputs.run == 'true' }}
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/unsupervised_historical_2010_vs_2015/matched_first_event_summary.json data/ml/unsupervised_historical_2010_vs_2015/matched_first_event_summary.csv data/ml/unsupervised_historical_2010_vs_2015/matched_first_event_diagnostics.csv
          if git diff --cached --quiet; then
            echo MATCHED_FIRST_EVENT_RESULT_UNCHANGED=true
          else
            git commit -m 'Save matched first-event ML accuracy and past-only trend-phase diagnostics' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::MATCHED_EVENT_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo MATCHED_FIRST_EVENT_SAVED=true
          fi
# No existing model weights, data collectors, or previous score summaries are modified.
