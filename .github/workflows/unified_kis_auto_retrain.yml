name: 통합 머신러닝 - KIS주가 자동 재학습

on:
  workflow_dispatch:
  # Recovery heartbeat from the hourly unified-research automation.
  # A heartbeat commit starts this job even when GitHub drops/delays a cron event.
  # Scope push triggering strictly to this workflow and the heartbeat; never broad repo pushes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified_kis_auto_retrain.yml'
      - 'automation/kis_ml_refit_heartbeat.json'
  # Hourly at :25 KST, following unified ChatGPT research at :05.
  # GitHub schedule may be delayed; concurrency serializes overlapping runs.
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: read

concurrency:
  group: unified-kis-ml-research-single-writer
  cancel-in-progress: false

jobs:
  kis-research-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout private KIS data and unified ML research source
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies without broker authentication
        run: python -m pip install pandas numpy scikit-learn joblib requests cryptography
      - name: Validate KIS-only source, PIT and automatic refit gates
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest \
            validation.ml.test_unified_kis_key_audit \
            validation.ml.test_unified_kis_training \
            validation.ml.test_unified_kis_auto_retrain -v
      - name: Check every hour and refit when KIS research inputs change
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.unified_kis_auto_retrain
      - name: Commit private KIS주가 research reports only (never models or raw prices)
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/research/ledger.json data/ml/research/auto_retrain/
          if git diff --cached --quiet; then
            echo UNIFIED_KIS_REFIT_UNCHANGED=true
          else
            git commit -m 'Record one KIS price research-only automatic refit' >/dev/null
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::UNIFIED_KIS_RESEARCH_REBASE_FAILED'
              exit 1
            fi
            git push origin HEAD:main
            echo UNIFIED_KIS_REFIT_PRIVATE_REPORT_SAVED=true
          fi

# Explicitly research-only. PIT/current-snapshot limitations remain unresolved:
# training_approved=false, point_in_time_verified=false,
# tradable_strategy_approved=false. No 2023 reads, order API or model deployment.
