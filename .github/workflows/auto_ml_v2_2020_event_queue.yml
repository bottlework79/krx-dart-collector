name: ML V2 - 2020 Dated Event Candidate Queue
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scikit-learn scipy requests
      - name: Synthetic safety regressions
        working-directory: private
        run: python -m unittest validation.ml.test_v2_2020_event_queue validation.ml.test_v2_past_window_exposure -v
      - name: Read-only dated KRX event candidates
        working-directory: private
        run: python -m analysis.ml.v2_2020_event_queue --output /tmp/v2_2020_event_queue.json
      - name: Store private candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-2020-event-queue-private-investigation
          path: /tmp/v2_2020_event_queue.json
          retention-days: 7
