name: Research ML - Immediate Bounded Experiment Chain (KRX Only)

on:
  workflow_dispatch:
  # Backup start/check only; after each success the next run dispatches immediately.
  schedule:
    - cron: '30 0 * * 1,3,5'
  # One-shot workflow integration test; removed after confirmed success.
  push:
    paths:
      - '.github/ml_research/chain_check_20261120.flag'

permissions:
  contents: read
  actions: write

concurrency:
  group: private-krx-auto-research-single-writer
  cancel-in-progress: false

jobs:
  offline-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private KRX source and immutable research artifacts
        uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          path: private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline data science dependencies
        run: python -m pip install pandas numpy scikit-learn joblib
      - name: Regression tests for cohort, temporal purge and sealed holdout
        working-directory: private
        run: |
          set -euo pipefail
          python -m unittest \
            validation.ml.test_auto_research_v1 \
            validation.ml.test_auto_research_review_v1 -v
      - name: Evaluate exactly one preregistered research hypothesis
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.auto_research_v1
      - name: Deterministic research review gate (NOT a ChatGPT review)
        id: postfit
        working-directory: private
        run: |
          set -euo pipefail
          python -m analysis.ml.auto_research_review_v1
          python - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads(Path('data/ml/auto_research_v1/review_state.json').read_text())
          next_candidate=state['next_candidate'] or 'none'
          # Never dispatch from unchecked/failed research review output.
          if state['training_approved'] or state['chatgpt_review_completed']:
              raise RuntimeError('Unexpected promotion or false ChatGPT review')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f'next_candidate={next_candidate}\n')
          print(f'AUTO_ML_NEXT_CANDIDATE={next_candidate}')
          PY
      - name: Commit only PRIVATE research report and experiment ledger
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ml/auto_research_v1/
          if git diff --cached --quiet; then
            echo AUTO_ML_NO_NEW_HYPOTHESIS=true
          else
            git commit -m 'Record one bounded autonomous research fold comparison' >/dev/null
            git fetch origin main >/dev/null
            if ! git rebase origin/main >/dev/null; then
              git rebase --abort || true
              echo '::error::AUTO_ML_PRIVATE_REBASE_FAILED'
              exit 1
            fi
            if ! git push origin HEAD:main >/dev/null; then
              echo '::error::AUTO_ML_PRIVATE_PUSH_FAILED'
              exit 1
            fi
            echo AUTO_ML_PRIVATE_RESEARCH_SAVED=true
          fi
      - name: Immediately queue next preregistered hypothesis on success
        if: ${{ success() && steps.postfit.outputs.next_candidate != 'none' && github.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN may trigger workflow_dispatch (unlike a push event).
          # One active writer and finite candidate ledger prevent fan-out.
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/auto_ml_research.yml/dispatches" -f ref=main
          echo AUTO_ML_NEXT_RUN_REQUESTED=true

# STOP: failures, changed historical input SHA, bad tests, bad QA,
# private git push/rebase failure, or dispatch failures never auto-advance.
# Five fixed hypotheses only; a new research design needs ChatGPT review.
