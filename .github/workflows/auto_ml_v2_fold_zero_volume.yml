name: ML V2 - Frozen Fold Zero Volume Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auto_ml_v2_fold_zero_volume.yml'
permissions:
  contents: read
concurrency:
  group: ml-v2-fold-zero-volume-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bottlework79/krx-stock-data
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scikit-learn joblib
      - name: Synthetic tests
        working-directory: private
        run: python -m unittest validation.ml.test_v2_fold_zero_volume_audit -v
      - name: Frozen KRX fold audit
        working-directory: private
        run: |
          python -m analysis.ml.v2_fold_zero_volume_audit --output /tmp/v2_fold_zero_volume.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v2_fold_zero_volume.json'))
          assert r['source_years_read']==list(range(2015,2023))
          assert r['sealed_year_used'] is False
          assert all(r[k] is False for k in ('training_approved','point_in_time_verified','tradable_strategy_approved'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-fold-zero-volume
          path: /tmp/v2_fold_zero_volume.json
          if-no-files-found: error
          retention-days: 14
